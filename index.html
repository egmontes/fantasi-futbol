  async function renderStandings() {
    const stats = computeSeasonStats();
    const totalPool = state.latestGW * 60;
    const totalShotguns = state.latestGW * 2;

    const currentGW = state.isLive ? state.liveGW : state.latestGW;

    // If chips not cached yet, fetch in background and re-render when done
    if (!_chipCache[currentGW]) {
      fetchChipsForGW(currentGW).then(() => {
        renderStandings();
      }).catch(() => {});
    }

    // Always refresh fixture counts when live (needed for Games Completed/Ongoing/Remaining)
    if (state.isLive && state.fixturesTotal === undefined) {
      fetchFPL('fixtures/?event=' + currentGW).then(fixtures => {
        const total = fixtures.length;
        state.fixturesOngoing = fixtures.filter(f => f.started && !f.finished).length;
        state.fixturesRemaining = Math.max(0, total - fixtures.filter(f => f.finished).length - state.fixturesOngoing);
        state.fixturesTotal = total;
        renderStandings();
      }).catch(() => {});
    }
    const standingsChips = _chipCache[currentGW] || {};
    const standingsCaptains = _captainCache[currentGW] || {};

    // If live, fetch real-time player scores — use cache, fire in background if missing
    if (!window._liveScoreCacheGW) window._liveScoreCacheGW = {};
    // Clear stale live score cache for current GW on each page load
    // (history can update and cache may be stale from previous session)
    if (!window._liveScoreClearedThisSession) {
      window._liveScoreClearedThisSession = true;
      localStorage.removeItem('ff_live_scores_' + currentGW);
      delete window._liveScoreCacheGW[currentGW];
    }
    // Restore live scores from localStorage if available and fresh (< 15min)
    if (!window._liveScoreCacheGW[currentGW]) {
      try {
        const saved = localStorage.getItem('ff_live_scores_' + currentGW);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Date.now() - parsed.ts < 15 * 60 * 1000) window._liveScoreCacheGW[currentGW] = parsed.data;
        }
      } catch(e) {}
    }
    let liveScoreMap = window._liveScoreCacheGW[currentGW] || {};
    // Fetch live scores if: live GW, OR GW just ended (latestGW matches and history may be stale)
    const shouldFetchLive = !window._liveScoreCacheGW[currentGW] && !window._liveScoreFetchInProgress &&
      (state.isLive || currentGW === state.latestGW);
    if (shouldFetchLive) {
      window._liveScoreFetchInProgress = true;
      (async () => {
        try {
          const liveData = await fetchFPL('event/' + currentGW + '/live/');
          const playerPts = {};
          liveData.elements.forEach(e => { playerPts[e.id] = e.stats.total_points; });
          const tempMap = {};
          const BATCH = 5;
          for (let i = 0; i < state.managers.length; i += BATCH) {
            const batch = state.managers.slice(i, i + BATCH);
            await Promise.all(batch.map(async m => {
              try {
                const picks = await fetchFPL('entry/' + m.id + '/event/' + currentGW + '/picks/');
                let rawPts = 0;
                picks.picks.forEach(p => { rawPts += (playerPts[p.element] || 0) * p.multiplier; });
                const hit = picks.entry_history?.event_transfers_cost || 0;
                tempMap[m.id] = { rawPts, netPts: rawPts - hit, hit };
              } catch(e) {}
            }));
          }
          window._liveScoreCacheGW[currentGW] = tempMap;
          window._liveScoreFetchInProgress = false;
          try {
            localStorage.setItem('ff_live_scores_' + currentGW, JSON.stringify({ data: tempMap, ts: Date.now() }));
          } catch(e) {}
          renderStandings();
        } catch(e) { window._liveScoreFetchInProgress = false; }
      })();
    }

    const rows = state.managers.map(m => {
      const s = stats[m.id] || {};
      const gmisses = getGuinnessOwed(m.name);
      const missedG = (state.guinnessDebts[m.name]?.missed_gws || []).length;
      const totalG = getTotalGuinnesses(m.name, s.bottom2 || 0);
      const latestHist = (state.gwHistory[m.id] || []).find(h => h.event === currentGW);
      // Use live score if available, fall back to history
      const liveScore = liveScoreMap[m.id];
      const histPts = latestHist ? (latestHist.points - (latestHist.event_transfers_cost || 0)) : null;
      const livePts = liveScore ? liveScore.netPts : null;
      // Use whichever is available; if both exist, prefer live (history can be stale right after GW ends)
      const gwLatestPts = livePts !== null ? livePts : histPts;
      const gwRawPts = liveScore ? liveScore.rawPts : (latestHist ? latestHist.points : null);
      const gwHit = liveScore ? liveScore.hit : (latestHist ? (latestHist.event_transfers_cost || 0) : 0);
      // Live total = last known total + live GW net score
      const prevHist = (state.gwHistory[m.id] || []).filter(h => h.event < currentGW).sort((a,b) => b.event - a.event)[0];
      // Use live score for total when available (covers live GW and post-GW stale history)
      const liveTotal = liveScore
        ? (prevHist ? prevHist.total_points : m.total) + liveScore.netPts
        : m.total;
      const chip = standingsChips[m.id] || null;
      const captain = standingsCaptains[m.id] || null;
      return { ...m, total: liveTotal, top4: s.top4 || 0, bottom2: s.bottom2 || 0, earned: s.moneyWon || 0, gmisses, missedG, totalG, gwLatestPts, gwRawPts, gwHit, chip, captain };
    });

    // Compute rank changes vs last GW
    const rankChangeMap = {};
    if (currentGW > 1) {
      // Current rank: use m.total (FPL standings) when live since gwHistory won't have currentGW yet
      // When not live, use total_points from gwHistory for currentGW
      const currRows = state.managers.map(m => {
        if (state.isLive) {
          // m.total from state.managers is FPL's live cumulative total
          const liveScore = liveScoreMap[m.id];
          const total = liveScore
            ? ((() => { const hist = state.gwHistory[m.id] || []; const prev = [...hist].filter(h => h.event < currentGW).sort((a,b) => b.event - a.event)[0]; return (prev ? prev.total_points : 0) + liveScore.netPts; })())
            : m.total;
          return { id: m.id, total };
        } else {
          const hist = state.gwHistory[m.id] || [];
          const entry = [...hist].filter(h => h.event <= currentGW).sort((a, b) => b.event - a.event)[0];
          return { id: m.id, total: entry ? entry.total_points : m.total };
        }
      }).sort((a, b) => b.total - a.total);
      const currentRankMap = {};
      let cr = 1;
      currRows.forEach((m, i) => {
        if (i > 0 && currRows[i].total < currRows[i-1].total) cr = i + 1;
        currentRankMap[m.id] = cr;
      });
      // Previous rank by total_points at end of currentGW-1
      const prevRows = state.managers.map(m => {
        const hist = state.gwHistory[m.id] || [];
        const entry = [...hist].filter(h => h.event <= currentGW - 1).sort((a, b) => b.event - a.event)[0];
        if (entry) return { id: m.id, total: entry.total_points };
        // Derive prev total from current GW entry if available
        const currEntry = hist.find(h => h.event === currentGW);
        return { id: m.id, total: currEntry ? currEntry.total_points - currEntry.points : 0 };
      }).sort((a, b) => b.total - a.total);
      const prevRankMap = {};
      let pr = 1;
      prevRows.forEach((m, i) => {
        if (i > 0 && prevRows[i].total < prevRows[i-1].total) pr = i + 1;
        prevRankMap[m.id] = pr;
        rankChangeMap[m.id] = currentRankMap[m.id] - prevRankMap[m.id]; // negative = moved up
      });
    }

    const col = standingsSort.col;
    const dir = standingsSort.dir === 'asc' ? 1 : -1;
    rows.sort((a, b) => {
      if (col === 'name') return dir * a.name.localeCompare(b.name);
      if (col === 'captain') { const ca = a.captain?.name||''; const cb = b.captain?.name||''; return dir * ca.localeCompare(cb); }
      if (col === 'gwpts') return dir * ((a.gwLatestPts||0) - (b.gwLatestPts||0));
      if (col === 'pts')  return dir * (a.total - b.total);
      if (col === 'played') {
        const ap = (window._playedCache || {})[currentGW]?.[a.id]?.played || 0;
        const bp = (window._playedCache || {})[currentGW]?.[b.id]?.played || 0;
        return dir * (ap - bp);
      }
      if (col === 'top4') return dir * (a.top4 - b.top4);
      if (col === 'bot2') return dir * (a.bottom2 - b.bottom2);
      if (col === 'earned') return dir * (a.earned - b.earned);
      if (col === 'gmisses') return dir * (a.gmisses - b.gmisses);
      if (col === 'missed') return dir * (a.missedG - b.missedG);
      if (col === 'totalg') return dir * (a.totalG - b.totalG);
      return 0;
    });

    const thClass = c => 'class="sortable' + (col === c ? ' sort-' + standingsSort.dir : '') + '"';

    // Compute season rank by total pts (independent of current sort)
    const seasonRankMap = {};
    const byTotal = [...rows].sort((a, b) => b.total - a.total);
    let sRank = 1;
    byTotal.forEach((m, i) => {
      if (i > 0 && byTotal[i].total < byTotal[i-1].total) sRank = i + 1;
      seasonRankMap[m.id] = sRank;
    });

    // Build basic ticker cards immediately (no expensive fetches)
    const tickerInsights = computeTickerInsights();
    const topMoneyManager = Object.keys(stats).reduce((bestId, id) => {
      if (bestId === null) return id;
      return stats[id].moneyWon > stats[bestId].moneyWon ? id : bestId;
    }, null);
    // Use cached values for expensive widgets; fetch in background if not cached
    const gwLabel = (state.isLive ? state.liveGW : state.latestGW) || state.latestGW;
    const transCacheKey = 'transfers_gw' + gwLabel;
    if (!window._transferCache) window._transferCache = {};
    const cachedTrans = window._transferCache[transCacheKey] || {};

    // Most captained — available immediately from _captainCache
    let mostCaptained = null;
    const captainsThisGW = _captainCache[gwLabel] || {};
    const captainCount = {};
    Object.values(captainsThisGW).forEach(c => {
      if (c && c.name) captainCount[c.name] = (captainCount[c.name] || 0) + 1;
    });
    const topCaptain = Object.entries(captainCount).sort((a, b) => b[1] - a[1])[0];
    if (topCaptain) mostCaptained = { name: topCaptain[0], count: topCaptain[1] };

    // Biggest mover up/down this GW (GW rank change vs previous GW)
    let biggestMoverUp = null, biggestMoverDown = null;
    if (gwLabel > 1) {
      // Check if current GW has real scores — use liveScoreMap when live
      const hasLiveScores = state.isLive && liveScoreMap && Object.keys(liveScoreMap).length > 0;
      const maxScore = hasLiveScores
        ? Math.max(...Object.values(liveScoreMap).map(s => s.netPts || 0))
        : Math.max(...(getWeeklyRankings(gwLabel).map(m => m.gwPoints || 0)), 0);
      const allZero = maxScore <= 0;
      const moverGW = allZero ? gwLabel - 1 : gwLabel;

      if (moverGW > 1) {
        const calcSeasonRank = (upToGW) => {
          const totals = state.managers.map(m => {
            const hist = state.gwHistory[m.id] || [];
            const entry = [...hist].filter(h => h.event <= upToGW).sort((a, b) => b.event - a.event)[0];
            let total = entry ? entry.total_points : 0;
            // Add live score on top when calculating rank for the live GW
            if (state.isLive && upToGW === gwLabel && liveScoreMap[m.id]) {
              const prevEntry = [...hist].filter(h => h.event < gwLabel).sort((a, b) => b.event - a.event)[0];
              total = (prevEntry ? prevEntry.total_points : 0) + (liveScoreMap[m.id].netPts || 0);
            }
            return { id: m.id, name: m.name, total };
          }).sort((a, b) => b.total - a.total);
          const rankMap = {};
          let r = 1;
          totals.forEach((m, i) => {
            if (i > 0 && totals[i].total < totals[i-1].total) r = i + 1;
            rankMap[m.id] = r;
          });
          return rankMap;
        };
        const currRankMap = calcSeasonRank(moverGW);
        const prevRankMap = calcSeasonRank(moverGW - 1);
        const moves = state.managers.map(m => ({
          name: m.name,
          change: (prevRankMap[m.id] || 0) - (currRankMap[m.id] || 0)
        }));

        const upMoves = moves.filter(m => m.change > 0).sort((a, b) => b.change - a.change);
        if (upMoves.length > 0) {
          const maxUp = upMoves[0].change;
          const tied = upMoves.filter(m => m.change === maxUp);
          if (tied.length === 1) biggestMoverUp = { name: tied[0].name, change: maxUp };
          else if (tied.length === 2) biggestMoverUp = { name: tied[0].name + ' & ' + tied[1].name, change: maxUp };
          else biggestMoverUp = { name: tied.length + '-way tie', change: maxUp };
        }
        const downMoves = moves.filter(m => m.change < 0).sort((a, b) => a.change - b.change);
        if (downMoves.length > 0) {
          const maxDown = downMoves[0].change;
          const tied = downMoves.filter(m => m.change === maxDown);
          if (tied.length === 1) biggestMoverDown = { name: tied[0].name, change: maxDown };
          else if (tied.length === 2) biggestMoverDown = { name: tied[0].name + ' & ' + tied[1].name, change: maxDown };
          else biggestMoverDown = { name: tied.length + '-way tie', change: maxDown };
        }
      }
    }
    let mostTransIn = window._transferCache[transCacheKey]?.in || null;
    let mostTransOut = window._transferCache[transCacheKey]?.out || null;

    // If not cached, fetch in background after render
    const transferFetchInProgress = window._transferFetchInProgress === transCacheKey;
    const needsTransferFetch = !window._transferCache[transCacheKey] && gwLabel > 1 && !transferFetchInProgress;

    const topMoney = topMoneyManager ? state.managers.find(m => m.id === parseInt(topMoneyManager, 10)) : null;
    const topMoneyValue = topMoneyManager ? stats[topMoneyManager].moneyWon : 0;

    // Compute season leader widgets
    const mostBottom2 = state.historyLoaded ? [...rows].sort((a,b) => b.bottom2 - a.bottom2)[0] : null;
    const mostTop4 = state.historyLoaded ? [...rows].sort((a,b) => b.top4 - a.top4)[0] : null;
    const mostGuinness = state.historyLoaded ? [...rows].sort((a,b) => b.totalG - a.totalG)[0] : null;

    const cards =
      (mostTransIn ? '<div class="stat-card stat-card-green" data-widget="trans-in"><div class="s-label">📈 GW' + gwLabel + ' Most Transferred In</div><div class="s-value">' + esc(mostTransIn.web_name) + '<br>' + mostTransIn.transfers_in_event.toLocaleString() + ' transfers</div></div>' : '') +
      (mostTransOut ? '<div class="stat-card stat-card-red" data-widget="trans-out"><div class="s-label">📉 GW' + gwLabel + ' Most Transferred Out</div><div class="s-value">' + esc(mostTransOut.web_name) + '<br>' + mostTransOut.transfers_out_event.toLocaleString() + ' transfers</div></div>' : '') +
      (mostCaptained ? '<div class="stat-card stat-card-gold"><div class="s-label">©️ GW' + gwLabel + ' Most Captained</div><div class="s-value">' + esc(mostCaptained.name) + '<br>' + mostCaptained.count + ' mgrs</div></div>' : '') +
      (biggestMoverUp ? '<div class="stat-card stat-card-green"><div class="s-label">🚀 GW' + gwLabel + ' Biggest Mover Up</div><div class="s-value">' + esc(biggestMoverUp.name) + (biggestMoverUp.change !== 0 ? '<br>▲' + biggestMoverUp.change + ' spots' : '') + '</div></div>' : '') +
      (biggestMoverDown ? '<div class="stat-card stat-card-red"><div class="s-label">📉 GW' + gwLabel + ' Biggest Mover Down</div><div class="s-value">' + esc(biggestMoverDown.name) + (biggestMoverDown.change !== 0 ? '<br>▼' + Math.abs(biggestMoverDown.change) + ' spots' : '') + '</div></div>' : '') +
      '<div class="stat-card"><div class="s-label">👥 Managers</div><div class="s-value single-line">' + state.managers.length + '</div></div>' +
      '<div class="stat-card"><div class="s-label">🏟 GWs Played</div><div class="s-value single-line">' + state.latestGW + '</div></div>' +
      '<div class="stat-card"><div class="s-label">💵 Payouts So Far</div><div class="s-value single-line">$' + totalPool + '</div></div>' +
      '<div class="stat-card stat-card-guinness"><div class="s-label">🍺 Guinness Chugged</div><div class="s-value single-line">' + rows.reduce((sum, m) => sum + m.totalG, 0) + '</div></div>' +
      (mostGuinness && mostGuinness.totalG > 0 ? '<div class="stat-card stat-card-guinness"><div class="s-label">🍺 Most Guinness</div><div class="s-value">' + esc(mostGuinness.name) + '<br>' + mostGuinness.totalG + '</div></div>' : '') +
      (mostTop4 && mostTop4.top4 > 0 ? '<div class="stat-card stat-card-green"><div class="s-label">🏆 Most Top 4 Finishes</div><div class="s-value">' + esc(mostTop4.name) + '<br>' + mostTop4.top4 + ' times</div></div>' : '') +
      (mostBottom2 && mostBottom2.bottom2 > 0 ? '<div class="stat-card stat-card-red"><div class="s-label">💀 Most Bottom 2 Finishes</div><div class="s-value">' + esc(mostBottom2.name) + '<br>' + mostBottom2.bottom2 + ' times</div></div>' : '') +
      '<div class="stat-card stat-card-green"><div class="s-label">🟢 Highest GW Score</div><div class="s-value">' + esc(tickerInsights.highest.manager) + '<br>GW' + tickerInsights.highest.gw + ' · ' + tickerInsights.highest.points + ' pts' + '</div></div>' +
      '<div class="stat-card stat-card-red"><div class="s-label">🔴 Lowest GW Score</div><div class="s-value">' + esc(tickerInsights.lowest.manager) + '<br>GW' + tickerInsights.lowest.gw + ' · ' + tickerInsights.lowest.points + ' pts' + '</div></div>' +
      '<div class="stat-card"><div class="s-label">👑 Biggest Win Margin</div><div class="s-value">' + esc(tickerInsights.biggestMargin.manager) + '<br>GW' + tickerInsights.biggestMargin.gw + ' · ' + tickerInsights.biggestMargin.margin + ' pts' + '</div></div>' +
      '<div class="stat-card"><div class="s-label">💰 Top Money Earned</div><div class="s-value">' + (topMoney ? esc(topMoney.name) + '<br>$' + topMoneyValue.toFixed(2).replace('.00','') : '—') + '</div></div>';
    let html = (state.historyLoaded ? '<div class="stat-ticker-wrap"><div class="stat-ticker">' + cards + cards + '</div></div>' : '') +
      '<div style="font-size:11px;color:var(--text3);font-family:var(--font-mono);margin-bottom:8px;text-align:right;">' +
        (state.isLive
          ? '<span style="color:var(--red);margin-right:8px;">● Live scores</span>'
          : state.isTransition
            ? '<span style="color:var(--amber);margin-right:8px;">⏳ GW' + state.transitionGW + ' Loading</span>'
            : '<span style="color:var(--green);margin-right:8px;">✓ GW Scores Final</span>') +
        'Updated: ' + new Date().toLocaleString('en-US', {timeZone:'America/New_York',month:'short',day:'numeric',hour:'numeric',minute:'2-digit',hour12:true}) + ' ET' +
        (state.isLive && state.fixturesTotal !== undefined
          ? '<br>Games Completed: ' + (state.fixturesTotal - state.fixturesOngoing - state.fixturesRemaining) + ' · Ongoing: ' + state.fixturesOngoing + ' · Remaining: ' + state.fixturesRemaining
          : '') +
        '</div>' +
      '<div class="table-scroll-wrap scroll-at-start"><div class="table-outer"><div class="table-wrap"><table id="standings-table">' +
      '<thead><tr>' +
      '<th style="width:52px">Rank</th>' +
      '<th ' + thClass('name') + ' data-col="name">Manager</th>' +
      '<th style="width:70px" ' + thClass('gwpts') + ' data-col="gwpts">GW' + (state.isLive ? state.liveGW : state.latestGW) + ' Pts</th>' +
      (( state.isLive || (window._playedCache || {})[currentGW]) ? '<th style="width:60px" ' + thClass('played') + ' data-col="played" title="Players played / total">Played</th>' : '') +
      '<th style="width:90px" ' + thClass('captain') + ' data-col="captain">Captain</th>' +
      '<th style="width:70px" ' + thClass('pts') + ' data-col="pts">Total PTS</th>' +
      '<th style="width:60px;text-align:center" ' + thClass('top4') + ' data-col="top4" title="Top-4 finishes">Top 4</th>' +
      '<th style="width:60px;text-align:center" ' + thClass('bot2') + ' data-col="bot2" title="Bottom-2 finishes">Bot 2</th>' +
      '<th style="width:80px" ' + thClass('earned') + ' data-col="earned">Earned</th>' +
      '<th style="width:70px;text-align:center" ' + thClass('gmisses') + ' data-col="gmisses" title="Missed Guinness shotguns owed">🍺 Owes</th>' +
      '<th style="width:70px;text-align:center" ' + thClass('missed') + ' data-col="missed" title="Shotguns missed this season">🍺 Missed</th>' +
      '<th style="width:70px;text-align:center" ' + thClass('totalg') + ' data-col="totalg" title="Total Guinnesses shotgunned this season">🍺 Total</th>' +
      '</tr></thead><tbody>';

    // Compute GW rank for medal display (always by gwLatestPts desc)
    const gwRanked = [...rows].filter(m => m.gwLatestPts !== null)
      .sort((a, b) => (b.gwLatestPts||0) - (a.gwLatestPts||0));
    const maxGWScore = gwRanked.length > 0 ? Math.max(...gwRanked.map(m => m.gwLatestPts || 0)) : 0;
    const allGWZero = maxGWScore <= 0;
    const gwRankMap = {};
    let gwRank = 1;
    gwRanked.forEach((m, i) => {
      if (i > 0 && gwRanked[i].gwLatestPts < gwRanked[i-1].gwLatestPts) gwRank = i + 1;
      gwRankMap[m.id] = gwRank;
    });

    // Bottom 2 map — last 2 unique score groups
    const gwBottomMap = {};
    const n = gwRanked.length;
    if (!allGWZero && n >= 2) {
      const scores = gwRanked.map(m => m.gwLatestPts);
      const uniqueScores = [...new Set(scores)].sort((a, b) => a - b);
      const bottom2Scores = new Set(uniqueScores.slice(0, 2));
      gwRanked.forEach(m => {
        if (bottom2Scores.has(m.gwLatestPts)) gwBottomMap[m.id] = true;
      });
    }

    rows.forEach((m, idx) => {
      const pos = idx + 1;
      const rowCls = pos === 1 ? 'row-1' : pos === 2 ? 'row-2' : pos === 3 ? 'row-3' : '';
      const gmissCell = m.gmisses >= 3
        ? '<span class="badge" style="background:#7a1a1a;color:#ffb3b3;border:1px solid rgba(255,100,100,0.3);">⚠️ ' + m.gmisses + '</span>'
        : m.gmisses >= 2
          ? '<span class="badge badge-bot">' + m.gmisses + '</span>'
          : m.gmisses === 1
            ? '<span style="color:var(--red);font-size:12px;font-family:var(--font-mono);">1</span>'
            : '<span class="badge-zero">—</span>';
      html += '<tr class="' + rowCls + '">' +
        '<td>' + (() => {
          const rank = seasonRankMap[m.id] || pos;
          const change = rankChangeMap[m.id];
          let indicator = '';
          if (!allGWZero && change !== undefined && change !== 0) {
            const diff = Math.abs(change);
            const color = change < 0 ? 'var(--green)' : 'var(--red)';
            const arrow = change < 0 ? '▲' : '▼';
            indicator = '<div style="display:inline-flex;flex-direction:column;align-items:center;margin-left:4px;vertical-align:middle;">' +
              '<span style="color:' + color + ';font-size:8px;line-height:1;font-family:var(--font-mono);">' + arrow + '</span>' +
              '<span style="color:' + color + ';font-size:8px;line-height:1;font-family:var(--font-mono);">' + diff + '</span>' +
              '</div>';
          }
          return '<div style="display:flex;align-items:center;"><span class="rank-num">' + rank + '</span>' + indicator + '</div>';
        })() + '</td>' +
        '<td><div class="m-name" style="' + (isKickedOut(m.name) ? 'text-decoration:line-through;color:var(--text3);' : '') + '">' + esc(m.name) + (isKickedOut(m.name) ? ' <span style="font-size:11px;color:var(--red);">KICKED</span>' : '') + '</div><div class="m-team">' + esc(m.team) + '</div>' + '<div style="display:flex;gap:2px;flex-wrap:nowrap;margin-top:3px;overflow:hidden;">' + buildChipBadges(m.id, m.chip, currentGW) + '</div></td>' +
        '<td>' + (() => {
          if (m.gwLatestPts === null) return '<span class="pts-val">—</span>';
          const rank = gwRankMap[m.id];
          const medals = { 1: '🥇', 2: '🥈', 3: '🥉', 4: '4️⃣' };
          const prizes = { 1: '$30', 2: '$15', 3: '$10', 4: '$5' };
          const medal = !allGWZero ? medals[rank] : null;
          const prize = prizes[rank];
          const rankSuffix = rank===1?'st':rank===2?'nd':'rd';
          const tip = medal ? ' <span class="tip" style="font-size:13px;">' + medal + '<span class="tip-text">' + rank + rankSuffix + ' place · Payout: ' + prize + '</span></span>' : '';
          const beerTip = !allGWZero && gwBottomMap[m.id] ? ' <span class="tip" style="font-size:13px;">🍺<span class="tip-text">Bottom 2 · Shotgun duty!</span></span>' : '';
          const hitBadge = m.gwHit > 0 ? '<span class="hit-cost">(-' + m.gwHit + ')</span>' : '';
          return '<span class="pts-val">' + m.gwRawPts + '</span>' + hitBadge + tip + beerTip;
        })() + '</td>' +
        (( state.isLive || (window._playedCache || {})[currentGW]) ? '<td style="font-family:var(--font-mono);font-size:12px;color:var(--text2);">' + (() => {
          const p = (window._playedCache || {})[currentGW]?.[m.id];
          if (!p) return '<span style="color:var(--text3);">—</span>';
          const color = p.played >= p.total ? 'var(--green)' : p.played > 0 ? 'var(--amber)' : 'var(--text3)';
          return '<span style="color:' + color + ';">' + p.played + '</span><span style="color:var(--text3);">/' + p.total + '</span>';
        })() + '</td>' : '') +
        '<td style="font-size:12px;color:var(--text2);">' + (() => { const c = m.captain; if (!c || !c.name) return '<span class="badge-zero">—</span>'; return c.isVC ? '<span title="Vice captain (captain DNP)">' + esc(c.name) + ' <span style="font-size:10px;color:var(--text3);">(vc)</span></span>' : esc(c.name); })() + '</td>' +

        '<td style="text-align:center">' + (!state.historyLoaded ? '<span class="badge-zero">—</span>' : m.bottom2 > 0 ? '<span class="badge badge-bot">' + m.bottom2 + '</span>' : '<span class="badge-zero">0</span>') + '</td>' +
        '<td><span class="' + (m.earned > 0 ? 'money-pos' : 'money-zero') + '">$' + (!state.historyLoaded ? '—' : m.earned.toFixed(2).replace('.00','')) + '</span></td>' +

        '<td style="text-align:center;font-family:var(--font-mono);font-size:13px;font-weight:500;color:' + (m.missedG > 0 ? 'var(--red)' : 'var(--text3)') + '">' + (!state.historyLoaded ? '—' : m.missedG > 0 ? m.missedG : '—') + '</td>' +
        '<td style="text-align:center;font-family:var(--font-mono);font-size:13px;font-weight:500;color:' + (m.totalG > 0 ? 'var(--amber)' : 'var(--text3)') + '">' + (!state.historyLoaded ? '—' : m.totalG > 0 ? m.totalG : '—') + '</td>' +
        '</tr>';
    });

    html += '</tbody></table></div></div>';
    // Save ticker offset before re-render
    const savedTickerOffset = window.__fantasiTickerOffset || 0;
    document.getElementById('standings-content').innerHTML = html;
    const tickerEl = document.querySelector('.stat-ticker');
    if (tickerEl) {
      // Restore offset so position doesn't reset on sort
      tickerEl.style.transform = `translateX(${savedTickerOffset}px)`;
      makeTickerInteractive(tickerEl, savedTickerOffset);
    }
    // Only re-fit stat cards if ticker content changed (prevents compounding shrink)
    const tickerEl2 = document.querySelector('.stat-ticker');

    if (newHash !== window.__tickerContentHash) {
      window.__tickerContentHash = newHash;

    requestAnimationFrame(() => { updateStickyOffsets(); initFloatingHeader('standings-table'); });

    // Scroll hint — update gradient visibility and column peek on scroll
    const tableOuter = document.querySelector('#standings-table')?.closest('.table-outer');
    const scrollWrap = document.querySelector('#standings-table')?.closest('.table-scroll-wrap');
    if (tableOuter && scrollWrap) {
      // Position left gradient dynamically after sticky columns
      const positionLeftGradient = () => {
        const stickyCol1 = tableOuter.querySelector('td:nth-child(1), th:nth-child(1)');
        const stickyCol2 = tableOuter.querySelector('td:nth-child(2), th:nth-child(2)');
        if (stickyCol1 && stickyCol2) {
          const stickyWidth = stickyCol1.offsetWidth + stickyCol2.offsetWidth;
          scrollWrap.style.setProperty('--sticky-width', stickyWidth + 'px');
        }
      };
      requestAnimationFrame(positionLeftGradient);

      const updateScrollHint = () => {
        const { scrollLeft, scrollWidth, clientWidth } = tableOuter;
        scrollWrap.classList.toggle('scroll-at-start', scrollLeft <= 2);
        scrollWrap.classList.toggle('scroll-at-end', scrollLeft + clientWidth >= scrollWidth - 2);
      };
      tableOuter.addEventListener('scroll', updateScrollHint, { passive: true });
      requestAnimationFrame(updateScrollHint);

    // Row click — expand drawer
    initDrawer('standings-table', currentGW);

    // Background fetch for transfer data if not cached yet — updates ticker after load
    if (needsTransferFetch) {
      window._transferFetchInProgress = transCacheKey;
      (async () => {
        try {
          const transIn = {}, transOut = {};
          const BATCH = 5;
          for (let i = 0; i < state.managers.length; i += BATCH) {
            const batch = state.managers.slice(i, i + BATCH);
            await Promise.all(batch.map(async m => {
              try {
                const data = await fetchFPL('entry/' + m.id + '/transfers/');
                data.filter(t => t.event === gwLabel).forEach(t => {
                  transIn[t.element_in] = (transIn[t.element_in] || 0) + 1;
                  transOut[t.element_out] = (transOut[t.element_out] || 0) + 1;
                });
              } catch(e) {}
            }));
          }
          const topIn = Object.entries(transIn).sort((a, b) => b[1] - a[1])[0];
          const topOut = Object.entries(transOut).sort((a, b) => b[1] - a[1])[0];
          const ti = topIn ? { web_name: state.bootstrapPlayers[topIn[0]] || 'Unknown', transfers_in_event: topIn[1] } : null;
          const to = topOut ? { web_name: state.bootstrapPlayers[topOut[0]] || 'Unknown', transfers_out_event: topOut[1] } : null;
          window._transferCache[transCacheKey] = { in: ti, out: to };

          renderStandings();

    // Attach sort click handlers
    document.querySelectorAll('#standings-table th.sortable').forEach(th => {
      th.addEventListener('click', async () => {

  // Cache for picks per manager per GW
  if (!window._picksCache) window._picksCache = {};

  async function prefetchPicks(gw) {
    if (!gw) return;
    // Fetch fixtures once for played calculation
    let startedTeams = new Set();
    try {
      const fixtures = await fetchFPL('fixtures/?event=' + gw);
      fixtures.filter(f => f.started).forEach(f => {
        startedTeams.add(f.team_h);
        startedTeams.add(f.team_a);
      });
    } catch(e) {}

    const BATCH = 5;
    for (let i = 0; i < state.managers.length; i += BATCH) {
      const batch = state.managers.slice(i, i + BATCH);
      await Promise.all(batch.map(async m => {
        const key = m.id + '_' + gw;
        if (window._picksCache[key]) {
          // Already have picks — still compute played if not cached
          if (!(window._playedCache || {})[gw]?.[m.id]) {
            computePlayedFromPicks(window._picksCache[key], m.id, gw, startedTeams);
          }
          return;
        }
        try {
          const picks = await fetchFPL('entry/' + m.id + '/event/' + gw + '/picks/');
          window._picksCache[key] = picks;
          computePlayedFromPicks(picks, m.id, gw, startedTeams);
        } catch(e) {}
      }));
    }
    // Re-render once all played data is ready
    renderStandings();
  }

  function computePlayedFromPicks(picks, managerId, gw, startedTeams) {
    if (!picks) return;
    const chip = picks.active_chip || null;
    const isBB = chip === 'bboost';
    const isTC = chip === '3xc';
    const activePicks = isBB ? picks.picks : picks.picks.filter(p => p.position <= 11);
    const captainMultiplier = isTC ? 3 : 2;
    const totalPlayers = activePicks.length + (captainMultiplier - 1);
    let playedCount = 0;
    activePicks.forEach(p => {
      const teamId = state.playerTeams?.[p.element];
      if (teamId && startedTeams.has(teamId)) {
        playedCount += p.is_captain ? captainMultiplier : 1;
      }
    });
    if (!window._playedCache) window._playedCache = {};
    if (!window._playedCache[gw]) window._playedCache[gw] = {};
    window._playedCache[gw][managerId] = { played: playedCount, total: totalPlayers };
  }

  function initDrawer(tableId, gw) {
    let _openDrawerRow = null;
    const table = document.getElementById(tableId);
    if (!table) return;
    const outer = table.closest('.table-outer');
    const drawerGW = gw || (state.isLive ? state.liveGW : state.latestGW);

    function syncDrawerScroll() {
      const inner = document.querySelector('.manager-drawer-inner');
      if (inner && outer) {
        inner.style.transform = 'translateX(' + outer.scrollLeft + 'px)';
        inner.style.width = (outer.clientWidth) + 'px';

    }

    if (outer) outer.addEventListener('scroll', syncDrawerScroll, { passive: true });

    table.querySelectorAll('tbody tr').forEach(tr => {
      // Get managerId from the row's data
      const managerName = tr.querySelector('.m-name')?.textContent?.trim();
      const manager = state.managers.find(m => m.name === managerName);
      const managerId = manager?.id;

      tr.addEventListener('click', () => {
        const existing = document.querySelector('.manager-drawer');
        if (existing) {
          const wasThisRow = existing.previousElementSibling === tr;
          existing.previousElementSibling?.classList.remove('drawer-open');
          existing.remove();
          _openDrawerRow = null;
          if (wasThisRow) return;

        const drawerTd = document.createElement('td');
        drawerTd.setAttribute('colspan', colCount);
        drawerTd.innerHTML = '<div class="manager-drawer-inner"><span class="spinner"></span><span>Loading...</span></div>';
        drawer.appendChild(drawerTd);
        tr.after(drawer);
        tr.classList.add('drawer-open');
        _openDrawerRow = tr;
        requestAnimationFrame(syncDrawerScroll);

        // Fetch picks + live/historical scores (use cache if available)
        (async () => {
          try {
            const cacheKey = managerId + '_' + drawerGW;
            const picks = window._picksCache?.[cacheKey] || await fetchFPL('entry/' + managerId + '/event/' + drawerGW + '/picks/');
            if (!window._picksCache) window._picksCache = {};
            window._picksCache[cacheKey] = picks;
            const chip = picks.active_chip || null;
            const isBB = chip === 'bboost';

            // Get player scores
            let playerPts = {};
            let playerStats = {};
            let fixtureMap = {}; // teamId -> fixture
            if (state.isLive && window._liveScoreCacheGW?.[drawerGW]) {
              Object.entries(window._liveScoreCacheGW[drawerGW]).forEach(([pid, s]) => {
                // _liveScoreCacheGW stores per-manager, not per-player
              });
              // Fetch live player stats and fixtures
              try {
                const [liveData, fixtureData] = await Promise.all([
                  fetchFPL('event/' + drawerGW + '/live/'),
                  fetchFPL('fixtures/?event=' + drawerGW)
                ]);
                liveData.elements.forEach(e => { playerPts[e.id] = e.stats.total_points; playerStats[e.id] = e.stats; });
                fixtureData.forEach(f => {
                  if (f.started) {
                    fixtureMap[f.team_h] = f;
                    fixtureMap[f.team_a] = f;
                  }
                });
              } catch(e) {}
            } else {
              try {
                const [liveData, fixtureData] = await Promise.all([
                  fetchFPL('event/' + drawerGW + '/live/'),
                  fetchFPL('fixtures/?event=' + drawerGW)
                ]);
                liveData.elements.forEach(e => { playerPts[e.id] = e.stats.total_points; playerStats[e.id] = e.stats; });
                fixtureData.forEach(f => {
                  if (f.started) {
                    fixtureMap[f.team_h] = f;
                    fixtureMap[f.team_a] = f;
                  }
                });
              } catch(e) {}
            }

            // Build emoji badge string from player stats
            const getEmojis = (elementId) => {
              const s = playerStats[elementId];
              const el = (state.bootstrapElements || []).find(e => e.id === elementId);
              const pos = el ? el.element_type : 0; // 1=GK, 2=DEF, 3=MID, 4=FWD
              if (!s) return '';
              let badges = '';
              for (let i = 0; i < (s.goals_scored || 0); i++) badges += '⚽';
              for (let i = 0; i < (s.assists || 0); i++) badges += '🎁';
              if ((s.clean_sheets || 0) > 0 && pos >= 1 && pos <= 3) badges += '🧱';
              for (let i = 0; i < (s.yellow_cards || 0); i++) badges += '🟨';
              for (let i = 0; i < (s.red_cards || 0); i++) badges += '🟥';
              // ⚔️ per 10 defcons for DEF/GK, per 12 for MID/FWD
              const defcons = s.clearances_blocks_interceptions || 0;
              const defThreshold = pos <= 2 ? 10 : 12;
              const swords = Math.floor(defcons / defThreshold);
              for (let i = 0; i < swords; i++) badges += '⚔️';
              // Every 3 saves = 1pt, show one glove per save point earned
              const savePts = Math.floor((s.saves || 0) / 3);
              for (let i = 0; i < savePts; i++) badges += '🧤';
              const bonus = s.bonus || 0;
              const bonusStr = bonus > 0 ? '<span style="font-size:9px;color:var(--amber);font-family:var(--font-mono);margin-left:2px;">+' + bonus + '</span>' : '';
              return badges ? { badges, bonusStr } : { badges: '', bonusStr };
            };

            const startingPicks = picks.picks.filter(p => p.position <= 11);
            const benchPicks = picks.picks.filter(p => p.position > 11);

            const renderPick = (p, isBench = false) => {
              const name = state.bootstrapPlayers[p.element] || ('Player ' + p.element);
              const pts = playerPts[p.element] ?? '—';
              const effectivePts = isBench ? pts : (pts !== '—' ? pts * p.multiplier : '—');
              const capLabel = p.multiplier === 3 ? ' (TC)' : p.multiplier === 2 ? ' (C)' : '';
              const mins = playerStats[p.element]?.minutes ?? null;
              const played = mins !== null && mins > 0;
              const nameColor = isBench ? 'var(--text3)' : (played ? 'var(--text)' : 'var(--text3)');
              const ptsColor = isBench ? 'var(--text3)' : (effectivePts !== '—' && effectivePts > 0 ? 'var(--green)' : 'var(--text3)');
              const { badges: emojis, bonusStr } = getEmojis(p.element);
              const el = (state.bootstrapElements || []).find(e => e.id === p.element);
              const teamId = el ? el.team : null;
              const teamEl = teamId && state.bootstrap ? (state.bootstrap.teams || []).find(t => t.id === teamId) : null;
              const teamName = teamEl ? teamEl.short_name : '';
              // Build score string
              let scoreStr = '';
              if (teamId && fixtureMap[teamId]) {
                const f = fixtureMap[teamId];
                if (f.team_h_score !== null && f.team_a_score !== null) {
                  const isHome = f.team_h === teamId;
                  const myScore = isHome ? f.team_h_score : f.team_a_score;
                  const oppScore = isHome ? f.team_a_score : f.team_h_score;
                  const result = myScore > oppScore ? 'var(--green)' : myScore < oppScore ? 'var(--red)' : 'var(--text3)';
                  scoreStr = '<span style="color:' + result + ';font-family:var(--font-mono);">' + myScore + '-' + oppScore + '</span>';
                }
              }
              const subLine = (teamName || mins !== null || scoreStr) ?
                '<div style="font-size:10px;color:var(--text3);margin-top:1px;display:flex;gap:4px;align-items:center;">' +
                (teamName ? '<span>' + esc(teamName) + '</span>' : '') +
                (mins !== null ? '<span>· ' + mins + ' min</span>' : '') +
                (scoreStr ? '<span>· ' + scoreStr + '</span>' : '') +
                '</div>' : '';
              return '<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--border);">' +
                '<div>' +
                '<div style="color:' + nameColor + ';font-size:12px;">' + esc(name) +
                '<span style="color:var(--theme);font-size:10px;">' + capLabel + '</span>' +
                (emojis ? '<span style="font-size:10px;margin-left:4px;letter-spacing:2px;">' + emojis + '</span>' : '') +
                bonusStr +
                '</div>' +
                subLine +
                '</div>' +
                '<span style="font-family:var(--font-mono);font-size:12px;color:' + ptsColor + ';min-width:30px;text-align:right;">' + effectivePts + '</span>' +
                '</div>';
            };

            const totalPts = startingPicks.reduce((sum, p) => {
              const pts = playerPts[p.element] ?? 0;
              return sum + pts * p.multiplier;
            }, 0);

            let html = '<div class="manager-drawer-inner" style="flex-direction:column;align-items:stretch;padding:0.75rem 1.5rem;">';
            html += '<div style="display:flex;justify-content:space-between;margin-bottom:8px;">';
            html += '<span style="font-size:11px;color:var(--theme);text-transform:uppercase;letter-spacing:0.06em;">Starting XI' + (isBB ? ' + Bench (BB)' : '') + '</span>';
            html += '<span style="font-size:11px;color:var(--theme);font-family:var(--font-mono);">Total: <span style="color:var(--text);">' + totalPts + ' pts</span></span>';
            html += '</div>';
            startingPicks.forEach(p => { html += renderPick(p, false); });

            if (benchPicks.length > 0) {
              html += '<div style="font-size:11px;color:var(--theme);text-transform:uppercase;letter-spacing:0.06em;margin:10px 0 6px;">Bench' + (isBB ? ' (Boost Active)' : '') + '</div>';
              benchPicks.forEach(p => { html += renderPick(p, !isBB); });
            }

            // Transfers made this GW
            try {
              const transfers = await fetchFPL('entry/' + managerId + '/transfers/');
              const gwTransfers = transfers.filter(t => t.event === drawerGW);

              if (gwTransfers.length > 0) {
                html += '<div style="font-size:11px;color:var(--theme);text-transform:uppercase;letter-spacing:0.06em;margin:10px 0 6px;">Transfers</div>';
                gwTransfers.forEach(t => {
                  const nameOut = state.bootstrapPlayers[t.element_out] || ('Player ' + t.element_out);
                  const nameIn = state.bootstrapPlayers[t.element_in] || ('Player ' + t.element_in);
                  const ptsIn = playerPts[t.element_in] ?? null;
                  const ptsOut = playerPts[t.element_out] ?? null;
                  const delta = (ptsIn !== null && ptsOut !== null) ? ptsIn - ptsOut : null;
                  const deltaStr = delta !== null
                    ? '<span style="font-family:var(--font-mono);font-size:11px;color:' +
                      (delta > 0 ? 'var(--green)' : delta < 0 ? 'var(--red)' : 'var(--text3)') +
                      ';margin-left:auto;white-space:nowrap;">' +
                      (delta > 0 ? '+' : '') + delta + ' pts</span>'
                    : '';
                  html += '<div style="display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:1px solid var(--border);font-size:12px;">' +
                    '<span style="color:var(--text3);text-decoration:line-through;">' + esc(nameOut) + '</span>' +
                    '<span style="color:var(--text3);">→</span>' +
                    '<span style="color:var(--text);">' + esc(nameIn) + '</span>' +
                    deltaStr +
                    '</div>';
                });
                if (gwTransfers.length === 0) {
                  html += '<div style="font-size:11px;color:var(--text3);font-family:var(--font-mono);">No transfers this GW</div>';
                }
              }
            } catch(e) {}

            html += '</div>';
            drawerTd.innerHTML = html;
            requestAnimationFrame(syncDrawerScroll);
          } catch(e) {
            drawerTd.innerHTML = '<div class="manager-drawer-inner"><span style="color:var(--red);">Failed to load picks.</span></div>';
          }
        })();
      });
    });
  }

  function fitStatCards() {
    // Reset all inline sizes first
    document.querySelectorAll('.stat-card .s-label').forEach(l => {
      l.style.fontSize = '9px';
      l.style.whiteSpace = 'nowrap';
    });
    document.querySelectorAll('.stat-card .s-value').forEach(v => {
      v.style.fontSize = '42px';
      v.style.whiteSpace = 'nowrap';
    });

    // Only process unique cards (ticker is doubled — skip duplicates by index)
    const allCards = Array.from(document.querySelectorAll('.stat-card'));
    const half = Math.ceil(allCards.length / 2);
    const cards = allCards.slice(0, half); // only first copy

    cards.forEach(card => {
      const label = card.querySelector('.s-label');
      const value = card.querySelector('.s-value');
      if (!value) return;
      const cardW = card.offsetWidth - 22;
      const cardH = card.offsetHeight - 22;
      const labelH = label ? label.offsetHeight + 5 : 0;
      const availH = cardH - labelH;
      let vSize = 42;
      // Use clientWidth not scrollWidth to avoid doubled content measuring
      value.style.overflow = 'hidden';
      while (vSize > 12 && (value.clientWidth > cardW || value.scrollHeight > availH)) {
        vSize -= 1;
        value.style.fontSize = vSize + 'px';
      }
      value.style.overflow = '';
    });

    // Apply same sizes to second copy
    allCards.slice(half).forEach((card, i) => {
      const srcValue = cards[i]?.querySelector('.s-value');
      const dstValue = card.querySelector('.s-value');
      if (srcValue && dstValue) dstValue.style.fontSize = srcValue.style.fontSize;
    });
  }

  function makeTickerInteractive(ticker, initialOffset = 0) {
    if (window.__fantasiTickerCleanup) window.__fantasiTickerCleanup();

    let isDragging = false;
    let startX;
    let lastX;
    let scrollLeft = 0;
    let offset = initialOffset;
    let velocity = 0;
    let lastTimestamp = null;
    let rafId = null;

    const getOffset = () => offset;
    const setOffset = (value) => {
      if (!document.body.contains(ticker)) return;
      const half = ticker.scrollWidth / 2;
      let normalized = value % half;
      if (normalized > 0) normalized -= half;
      offset = normalized;
      ticker.style.transform = `translateX(${offset}px)`;
      window.__fantasiTickerOffset = offset;
    };

    const step = (timestamp) => {
      // Initialize timestamp only on first call
      if (lastTimestamp === null) {
        lastTimestamp = timestamp;
        rafId = requestAnimationFrame(step);
        return; // Skip first frame to avoid huge delta
      }

      const delta = timestamp - lastTimestamp;
      lastTimestamp = timestamp;

      if (!isDragging) {
        const baseSpeed = -(ticker.scrollWidth / 2) / 30000;
        const maxMomentum = 2;
        if (velocity > maxMomentum) velocity = maxMomentum;
        if (velocity < -maxMomentum) velocity = -maxMomentum;
        setOffset(offset + (baseSpeed + velocity) * delta);

        if (velocity !== 0) {
          velocity *= 0.95;
          if (Math.abs(velocity) < 0.00005) velocity = 0;
        }
      }

      rafId = requestAnimationFrame(step);
    };

    const handleVisibilityChange = () => {
      if (!document.hidden) {
        lastTimestamp = null;
        isDragging = false;
        ticker.classList.remove('is-dragging');
        if (rafId !== null) cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(step);
      }
    };

    const start = (e) => {
      isDragging = true;
      ticker.classList.add('is-dragging');
      startX = (e.pageX || e.touches[0].pageX) - ticker.offsetLeft;
      lastX = startX;
      scrollLeft = getOffset();
      lastTimestamp = performance.now();
      velocity = 0;
    };

    const move = (e) => {
      if (!isDragging) return;
      e.preventDefault();
      const x = (e.pageX || e.touches[0].pageX) - ticker.offsetLeft;
      const now = performance.now();
      const dt = now - lastTimestamp;
      if (dt > 0) {
        velocity = (x - lastX) / dt;
      }
      setOffset(scrollLeft + (x - startX));
      lastX = x;
      lastTimestamp = now;
    };

    const end = () => {
      if (!isDragging) return;
      isDragging = false;
      ticker.classList.remove('is-dragging');
      lastTimestamp = performance.now();
    };

    const touchStartOptions = { passive: true };
    const touchMoveOptions = { passive: false };

    ticker.addEventListener('mousedown', start);
    ticker.addEventListener('touchstart', start, touchStartOptions);
    window.addEventListener('mousemove', move);
    window.addEventListener('touchmove', move, touchMoveOptions);
    window.addEventListener('mouseup', end);
    window.addEventListener('touchend', end);
    document.addEventListener('visibilitychange', handleVisibilityChange);

    const cleanup = () => {
      ticker.removeEventListener('mousedown', start);
      ticker.removeEventListener('touchstart', start, touchStartOptions);
      window.removeEventListener('mousemove', move);
      window.removeEventListener('touchmove', move, touchMoveOptions);
      window.removeEventListener('mouseup', end);
      window.removeEventListener('touchend', end);
      document.removeEventListener('visibilitychange', handleVisibilityChange);
      if (rafId !== null) cancelAnimationFrame(rafId);
      rafId = null;
    };

    window.__fantasiTickerCleanup = cleanup;

    window.__fantasiTickerPause = () => {
      if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
    };

    // Expose resume so tab switching can reset the timestamp smoothly
    window.__fantasiTickerResume = () => {
      lastTimestamp = null;
      isDragging = false;
      ticker.classList.remove('is-dragging');
      if (rafId !== null) cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(step);
    };

    rafId = requestAnimationFrame(step);
  }

      });

      // Fetch picks for all managers in batches
      const BATCH = 5;
      const managerScores = {};
      for (let i = 0; i < state.managers.length; i += BATCH) {
        const batch = state.managers.slice(i, i + BATCH);
        await Promise.all(batch.map(async m => {
          try {
            const picks = await fetchFPL('entry/' + m.id + '/event/' + gw + '/picks/');
            let pts = 0;
            picks.picks.forEach(p => {
              const playerPts = liveScores[p.element] || 0;
              pts += playerPts * p.multiplier;
            });
            // Get hit cost — try entry_history first, then gwHistory
            // entry_history.event_transfers_cost is the hit in points (e.g. 4 for one extra transfer)
            let hit = 0;
            if (picks.entry_history?.event_transfers_cost) {
              hit = picks.entry_history.event_transfers_cost;
            } else {
              const hist = state.gwHistory[m.id] || [];
              const gwEntry = hist.find(h => h.event === gw);
              if (gwEntry?.event_transfers_cost) hit = gwEntry.event_transfers_cost;
            }
            // pts is raw sum of player points × multipliers, subtract hit to get net
            const netPts = pts - hit;
            if (hit > 0) console.log(m.name, 'raw:', pts, 'hit:', hit, 'net:', netPts);
            // Get captain name for live table
            const captainPick = picks.picks.find(p => p.is_captain);
            const captainId = captainPick?.element;

            managerScores[m.id] = { pts: netPts, rawPts: pts, chip: picks.active_chip, hit, captainName };
          } catch(e) {

        }));
        const done = Math.min(i + BATCH, state.managers.length);

  function chipLabel(chip) {
    const map = { freehit: 'FH', wildcard: 'WC', bboost: 'BB', '3xc': 'TC' };
    return map[chip] || chip;
  }

  const ALL_CHIPS = ['bboost', 'wildcard', 'freehit', '3xc'];
  const CHIP_LABELS = { bboost: 'BB', wildcard: 'WC', freehit: 'FH', '3xc': 'TC' };

  // Build chip badges for a manager: all 4 chips, colored by status
  function buildChipBadges(managerId, currentGWChip, referenceGW) {
    // Find which chips used in the CURRENT HALF before referenceGW
    // Chips used in the previous half don't count (managers get a fresh set each half)
    const secondHalfStart = state.secondHalfStart || 20;
    const isH2 = referenceGW >= secondHalfStart;
    const halfStart = isH2 ? secondHalfStart : 1;
    const halfEnd = isH2 ? referenceGW : Math.min(referenceGW, secondHalfStart);
    const usedInPast = new Set();
    const managerChips = (state.chipsHistory || {})[managerId] || {};
    Object.entries(managerChips).forEach(([gw, chip]) => {
      const gwNum = parseInt(gw);
      if (gwNum >= halfStart && gwNum < halfEnd && chip !== currentGWChip) usedInPast.add(chip);
    });
    if (managerId === 1845913) console.log('Mitch chips:', managerChips, 'halfStart:', halfStart, 'refGW:', referenceGW, 'usedInPast:', [...usedInPast]);
    return ALL_CHIPS.map(chip => {
      const label = CHIP_LABELS[chip];
      const isActive = chip === currentGWChip;
      const usedPast = !isActive && usedInPast.has(chip);
      if (isActive) {
        return '<span class="badge-chip" style="white-space:nowrap;">' + label + '</span>';
      } else if (usedPast) {
        return '<span style="font-size:10px;font-family:var(--font-mono);font-weight:600;padding:2px 5px;border-radius:99px;display:inline-block;margin-top:3px;letter-spacing:0.02em;background:rgba(100,100,100,0.15);color:var(--text3);border:1px solid rgba(255,255,255,0.08);text-decoration:line-through;white-space:nowrap;">' + label + '</span>';
      } else {
        return '<span style="font-size:10px;font-family:var(--font-mono);font-weight:600;padding:2px 5px;border-radius:99px;display:inline-block;margin-top:3px;letter-spacing:0.02em;background:rgba(100,100,100,0.1);color:var(--text3);border:1px solid rgba(255,255,255,0.06);white-space:nowrap;">' + label + '</span>';
      }
    }).join(' ');
  }

  // Cache chips per GW so we don't refetch
  const _chipCache = {};
  const _captainCache = {};

  // Restore chip/captain caches from localStorage on hard refresh
  (function restoreCaches() {
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key && key.startsWith('ff_chips_cache_')) {
        const gw = parseInt(key.replace('ff_chips_cache_', ''));
        try { _chipCache[gw] = JSON.parse(localStorage.getItem(key)); } catch(e) {}
      }
      if (key && key.startsWith('ff_captains_cache_')) {
        const gw = parseInt(key.replace('ff_captains_cache_', ''));
        try { _captainCache[gw] = JSON.parse(localStorage.getItem(key)); } catch(e) {}
      }
    }
  })();

  async function fetchChipsForGW(gw) {
    if (_chipCache[gw]) return _chipCache[gw];
    const chips = {};
    const captains = {};

    // Fetch live stats + fixtures ONCE upfront, in parallel with all picks
    const [liveStatsRes, fixturesRes, ...picksRes] = await Promise.allSettled([
      fetchFPL('event/' + gw + '/live/'),
      fetchFPL('fixtures/?event=' + gw),
      ...state.managers.map(m => fetchFPL('entry/' + m.id + '/event/' + gw + '/picks/')
        .then(d => ({ managerId: m.id, data: d }))
        .catch(() => ({ managerId: m.id, data: null })))
    ]);

    // Build stats and fixture maps
    const statsMap = {};
    if (liveStatsRes.status === 'fulfilled') {
      liveStatsRes.value.elements.forEach(e => { statsMap[e.id] = e.stats; });
    }

    const teamsWithFixture = new Set();
    const finishedTeams = new Set();
    if (fixturesRes.status === 'fulfilled') {
      const allFixtures = fixturesRes.value;
      const totalFixtures = allFixtures.length;
      const ongoingFixtures = allFixtures.filter(f => f.started && !f.finished).length;
      const finishedFixtures = allFixtures.filter(f => f.finished).length;
      state.fixturesOngoing = ongoingFixtures;
      state.fixturesRemaining = Math.max(0, totalFixtures - finishedFixtures - ongoingFixtures);
      state.fixturesTotal = totalFixtures;
      allFixtures.forEach(f => {
        teamsWithFixture.add(f.team_h);
        teamsWithFixture.add(f.team_a);
        if (f.finished || f.started) {
          finishedTeams.add(f.team_h);
          finishedTeams.add(f.team_a);
        }
      });
    }

    // Process each manager's picks
    picksRes.forEach(res => {
      if (res.status !== 'fulfilled' || !res.value.data) {
        const mid = res.value?.managerId;
        if (mid) { chips[mid] = null; captains[mid] = { name: null, isVC: false }; }
        return;
      }
      const { managerId, data: picks } = res.value;
      chips[managerId] = picks.active_chip || null;

      const captainPick = picks.picks.find(p => p.is_captain);
      const vcPick = picks.picks.find(p => p.is_vice_captain);
      const captainId = captainPick?.element;
      const vcId = vcPick?.element;

      let captainName = captainId ? (state.bootstrapPlayers[captainId] || '?') : null;
      let isVC = false;

      if (captainId) {
        const captainTeamId = state.playerTeams?.[captainId];
        const vcTeamId = vcId ? state.playerTeams?.[vcId] : null;
        const captainHasFixture = captainTeamId && teamsWithFixture.has(captainTeamId);
        const vcHasFixture = vcTeamId && teamsWithFixture.has(vcTeamId);

        if (!captainHasFixture) {
          if (vcId && vcHasFixture) {
            captainName = state.bootstrapPlayers[vcId] || '?';
            isVC = true;
          }
        } else {
          const captainMatchPlayed = finishedTeams.has(captainTeamId);
          const captainPlayed = captainMatchPlayed && (statsMap[captainId]?.minutes || 0) > 0;
          if (captainMatchPlayed && !captainPlayed && vcId) {
            captainName = state.bootstrapPlayers[vcId] || '?';
            isVC = true;
          }
        }
      }

      captains[managerId] = { name: captainName, isVC };
    });

    _chipCache[gw] = chips;
    _captainCache[gw] = captains;
    // Persist to localStorage for hard refresh survival
    try {

  function formatPlayerStats(playerId, liveStats, multiplier) {
    const s = liveStats[playerId];
    if (!s) return null;
    const pts = s.pts * (multiplier || 1);
    if (s.minutesPlayed === 0) return pts + ' pts (DNP)';
    const parts = [];
    if (s.goals > 0) parts.push(s.goals + ' goal' + (s.goals > 1 ? 's' : ''));
    if (s.assists > 0) parts.push(s.assists + ' assist' + (s.assists > 1 ? 's' : ''));
    if (s.cleanSheet > 0) parts.push('clean sheet');
    if (s.saves >= 3) parts.push(s.saves + ' saves');
    if (s.yellowCards > 0) parts.push('yellow card');
    if (s.redCards > 0) parts.push('red card');
    if (s.bonus > 0) parts.push(s.bonus + ' bonus');
    const context = parts.length > 0 ? ' — ' + parts.join(', ') : ' — no returns';
    return pts + ' pts' + context;
  }

  async function fetchManagerGWDetail(managerId, gw) {
    try {
      const [picksData, histData, liveStats] = await Promise.all([
        fetchFPL('entry/' + managerId + '/event/' + gw + '/picks/'),
        fetchFPL('entry/' + managerId + '/transfers/'),
        fetchLiveStats(gw),
      ]);

      // Captain
      const captainPick = picksData.picks.find(p => p.is_captain);
      const vcPick = picksData.picks.find(p => p.is_vice_captain);
      const captainId = captainPick ? captainPick.element : null;
      const vcId = vcPick ? vcPick.element : null;
      const captainMult = captainPick ? captainPick.multiplier : 2;

      // If captain didn't play (0 minutes / not in live stats), show vice captain
      const captainPlayed = captainId && (liveStats[captainId]?.minutes || 0) > 0;
      const displayCaptainId = captainPlayed ? captainId : (vcId || captainId);
      const captainName = displayCaptainId ? (state.bootstrapPlayers[displayCaptainId] || 'Unknown') : null;
      const captainDNP = captainId && !captainPlayed && vcId;

      const captainStats = captainId ? formatPlayerStats(captainId, liveStats, captainMult) : null;

      // Chip used
      const chip = picksData.active_chip || null;

      // Transfers for this GW with player scores
      const gwTransfers = histData.filter(t => t.event === gw);
      const transfersIn = gwTransfers.map(t => {
        const name = state.bootstrapPlayers[t.element_in] || ('Player ' + t.element_in);
        const stats = formatPlayerStats(t.element_in, liveStats, 1);
        return { name, stats };
      });
      const transfersOut = gwTransfers.map(t => {
        const name = state.bootstrapPlayers[t.element_out] || ('Player ' + t.element_out);
        const stats = formatPlayerStats(t.element_out, liveStats, 1);
        return { name, stats };
      });

      // Split picks into starting XI and bench
      const startingPicks = picksData.picks.filter(p => p.position <= 11);
      const benchPicks = picksData.picks.filter(p => p.position > 11);

      // Standout performers in starting XI (8+ pts, excluding captain who's already shown)
      const standouts = startingPicks
        .filter(p => !p.is_captain && (liveStats[p.element]?.pts || 0) >= 8)
        .map(p => ({
          element: p.element,
          name: state.bootstrapPlayers[p.element] || ('Player ' + p.element),
          stats: formatPlayerStats(p.element, liveStats, 1),
        }))
        .sort((a, b) => (liveStats[b.element]?.pts || 0) - (liveStats[a.element]?.pts || 0));

      // Underperformers — captain who blanked (<=2 pts)
      const captainBlank = captainId && (liveStats[captainId]?.pts || 0) <= 2;

      // Bench points — anyone on bench who scored 6+ pts (wasted points)
      const benchWaste = benchPicks
        .map(p => ({
          name: state.bootstrapPlayers[p.element] || ('Player ' + p.element),
          pts: liveStats[p.element]?.pts || 0,
          stats: formatPlayerStats(p.element, liveStats, 1),
        }))
        .filter(p => p.pts >= 6)
        .sort((a, b) => b.pts - a.pts);

      return { picks: picksData.picks, captainName, captainDNP, captainStats, captainMult, captainBlank, chip, transfersIn, transfersOut, standouts, benchWaste };
    } catch(e) {
      return null;
    }
  }

// --- Helper: group managers by equal GW points (tie-aware) ---
function groupByPoints(ranked) {
  const groups = [];
  let i = 0;
  while (i < ranked.length) {
    const pts = ranked[i].gwPoints;
    let j = i;
    while (j < ranked.length && ranked[j].gwPoints === pts) j++;
    groups.push({
      points: pts,
      managers: ranked.slice(i, j).map(m => m.name)
    });
    i = j;
  }
  return groups;
}

/***********************
 * NEW FPL SCORING ENGINE
 ***********************/
function buildPlayerMaps(liveData, bootstrap) {
  const points = {}, minutes = {}, types = {}, names = {}, stats = {};

  liveData.elements.forEach(p => {
    const s = p.stats;
    points[p.id] = s.total_points || 0;
    minutes[p.id] = s.minutes || 0;
    stats[p.id] = {
      goals: s.goals_scored || 0,
      assists: s.assists || 0,
      cleanSheet: s.clean_sheets || 0,
      goalsConceded: s.goals_conceded || 0,
      yellowCards: s.yellow_cards || 0,
      redCards: s.red_cards || 0,
      saves: s.saves || 0,
      bonus: s.bonus || 0,
      minutesPlayed: s.minutes || 0,
    };
  });

  bootstrap.elements.forEach(p => {
    types[p.id] = p.element_type;
    names[p.id] = p.web_name;
  });

  return { points, minutes, types, names, stats };
}

function isValidFormation(c) {
  return c[1] === 1 && c[2] >= 3 && c[3] >= 2 && c[4] >= 1;
}

function countPositions(picks, types) {
  const c = {1:0,2:0,3:0,4:0};
  picks.forEach(p => c[types[p.element]]++);
  return c;
}

function applyAutosubs(starters, bench, minutes, types) {
  let XI = [...starters];
  bench = [...bench];

  // GK swap
  const gk = XI.find(p => types[p.element] === 1);
  const bgk = bench.find(p => types[p.element] === 1);

  if (gk && bgk && minutes[gk.element] === 0 && minutes[bgk.element] > 0) {
    XI = XI.map(p => p.element === gk.element ? bgk : p);
    bench = bench.filter(p => p.element !== bgk.element);
    bench.push(gk);
  }

  // outfield
  for (let i=0;i<XI.length;i++) {
    if (minutes[XI[i].element] > 0) continue;

    for (let j=0;j<bench.length;j++) {
      const sub = bench[j];
      if (minutes[sub.element] === 0) continue;

      const tmp = [...XI];
      tmp[i] = sub;

      if (isValidFormation(countPositions(tmp, types))) {
        XI[i] = sub;
        bench.splice(j,1);
        bench.push(starters[i]);
        break;
      }
    }
  }

  return { XI, bench };
}

function resolveCaptain(picks, minutes) {
  const c = picks.find(p=>p.is_captain);
  const vc = picks.find(p=>p.is_vice_captain);

  if (!c) return null;
  if (minutes[c.element] > 0) return c;
  if (vc && minutes[vc.element] > 0) return vc;
  return c;
}

function computeTeam(picks, liveData, bootstrap, chip) {
  const { points, minutes, types, names, stats } =
    buildPlayerMaps(liveData, bootstrap);

  const starters = picks.filter(p=>p.position<=11);
  const bench = picks.filter(p=>p.position>11)
                     .sort((a,b)=>a.position-b.position);

  const { XI, bench: rem } =
    applyAutosubs(starters, bench, minutes, types);

  const cap = resolveCaptain(picks, minutes);

  let total = 0;

  const breakdown = XI.map(p => {
    let mult = p.multiplier || 1;

    if (cap && p.element === cap.element) {
      mult = chip === '3xc' ? 3 : 2;
    }

    const pts = (points[p.element] || 0) * mult;
    total += pts;

    return { id: p.element, pts, stats: stats[p.element] };
  });

  const benchPts = rem.reduce((s,p)=>s+(points[p.element]||0),0);

  if (chip === 'bboost') total += benchPts;

  return { total, cap: cap?.element, breakdown, benchPts, names, types };
}

async function buildPrompt(gw) {
    const stats = computeSeasonStats(gw);
    const ranked = getWeeklyRankings(gw);
    const weekPrizes = computeWeeklyPrizes(ranked);
    const n = ranked.length;

    // Compute season standings up to this GW
    const seasonStandings = {};
    state.managers.forEach(m => {
      const hist = state.gwHistory[m.id] || [];
      const total = hist.filter(h => h.event <= gw).reduce((sum, h) => sum + h.points - h.event_transfers_cost, 0);
      seasonStandings[m.id] = total;
    });
    // Sort managers by season total to get rank
    const seasonRanked = Object.entries(seasonStandings)
      .sort((a, b) => b[1] - a[1])
      .map((entry, idx) => ({ id: parseInt(entry[0]), total: entry[1], rank: idx + 1 }));
    const seasonRankMap = {};
    seasonRanked.forEach(sr => { seasonRankMap[sr.id] = sr.rank; });

    // Compute season rank at previous GW for rank change
    const prevSeasonRankMap = {};
    if (gw > 1) {
      const prevSeasonRows = state.managers.map(m => {
        const hist = state.gwHistory[m.id] || [];
        const entry = [...hist].filter(h => h.event <= gw - 1).sort((a, b) => b.event - a.event)[0];

      }).sort((a, b) => b.total - a.total);
      let prevR = 1;
      prevSeasonRows.forEach((m, i) => {
        if (i > 0 && prevSeasonRows[i].total < prevSeasonRows[i-1].total) prevR = i + 1;
        prevSeasonRankMap[m.id] = prevR;
      });
    }

    // Compute GW rank change vs previous GW
    const prevGWRankMap = {};
    if (gw > 1) {
      const prevRanked = getWeeklyRankings(gw - 1);
      let prevGWRank = 1;
      prevRanked.forEach((m, i) => {
        if (i > 0 && prevRanked[i].gwPoints < prevRanked[i-1].gwPoints) prevGWRank = i + 1;

    // Build cup matchup map for this GW
    const cupMatchMap = {}; // managerId -> { opponent, myPts, oppPts, won, lost, isBye, roundName }
    const cupMatches = window._allCupMatches || [];
    const gwCupMatches = cupMatches.filter(m => m.event === gw);
    if (gwCupMatches.length > 0) {
      // Determine round name
      const allRoundEvents = [...new Set(cupMatches.map(m => m.event))].sort((a, b) => a - b);
      const roundIdx = allRoundEvents.indexOf(gw);
      const ROUND_NAMES = { 1: 'Round of 64', 2: 'Round of 32', 3: 'Round of 16', 4: 'Quarter-finals', 5: 'Semi-finals', 6: 'Final' };
      const roundName = ROUND_NAMES[roundIdx + 1] || ('Cup Round ' + (roundIdx + 1));
      gwCupMatches.forEach(match => {
        const m1 = state.managers.find(m => m.id === match.entry_1_entry);
        const m2 = state.managers.find(m => m.id === match.entry_2_entry);

            oppPts: match.entry_2_points,

            opponent: m1 ? m1.name : 'BYE',

            oppPts: match.entry_1_points,

            lost: match.winner && match.winner !== m2.id,

      });
    }

    // Assign display ranks for ties
    let displayRank = 1;
    ranked.forEach((m, idx) => {
      if (idx > 0 && ranked[idx].gwPoints < ranked[idx-1].gwPoints) displayRank = idx + 1;
      m._displayRank = displayRank;
    });

    // Find key managers: top-4 positions (expanded for ties) + bottom-2 (expanded for ties)
    const keyIds = new Set();

    // Top: find all managers in prize positions including ties

    // but only fetch transfers/captain detail for key managers
    const keyManagers = ranked.filter(m => keyIds.has(m.id));
    const [details, allChips, ownership, liveData] = await Promise.all([
  fetchAllGWDetails(gw, ranked),
  fetchChipsForGW(gw),
  fetchOwnershipForGW(gw),
  fetchFPL('event/' + gw + '/live/')
]);

    const summaryLines = ranked.map((m, idx) => {
      const s = stats[m.id] || {};
      const p = weekPrizes[m.id];
      const d = details[m.id];
      let result = 'no prize';
      if (p.prize > 0) {

      let extras = [];
      if (d) {
        if (d && d.picks) {
  const team = computeTeam(

      const pos = posLabels[team.types?.[p.id]] || '?';

  if (bench.length > 0) extras.push('Bench: ' + bench.join(' | '));

  if (team.benchPts > 0 && d.chip !== 'bboost') {

  if (d.chip) {

    extras.push('Chip used: ' + (chipNames[d.chip] || d.chip));
  }

  // Transfers with point impact
  if (d.transfersIn && d.transfersIn.length > 0) {
    const hit = d.picks?.entry_history?.event_transfers_cost || 0;
    const tLines = d.transfersIn.map((tin, i) => {
      const tout = d.transfersOut[i];
      const inPts = tin.stats?.pts || 0;
      const outPts = tout?.stats?.pts || 0;

  }
}
      }

      // Use GW-specific owed count so the prompt reflects debt at the time of this GW
      const gmissCount = getGuinnessOwedAtGW(m.name, gw);

        const dangerStr = isKickedOut(m.name) ? ' KICKED OUT OF LEAGUE' : (gmissCount >= 3 ? ' WARNING: ONE MORE MISS AND THEY ARE KICKED OUT' : '');

      // Add cup matchup if applicable

      if (cup) {
        if (cup.isBye) {

        } else {

      const hist = state.gwHistory[m.id] || [];

      const seasonRank = seasonRankMap[m.id] || '-';

      const seasonRankChange = prevSeasonRank ? prevSeasonRank - seasonRank : 0; // positive = moved up
      const seasonRankStr = seasonRankChange > 0 ? ' ↑' + seasonRankChange : seasonRankChange < 0 ? ' ↓' + Math.abs(seasonRankChange) : ' (no change)';

      let line = m._displayRank + '. ' + m.name + ' (' + m.team + '): ' + m.gwPoints + ' pts | Season total: ' + gwTotal + ' (Rank ' + seasonRank + seasonRankStr + ') | Top-4 finishes: ' + s.top4 + ' | Bottom-2 finishes: ' + s.bottom2 + ' | ' + result;
      if (extras.length > 0) line += ' | ' + extras.join(' | ');
      return line;
    }).join('\n');

    // Build league context blurbs
    const leagueContextLines = [];
    const totalGWs = 38;
    const halfwayGW = 19; // second half starts GW20
    const gwsRemaining = totalGWs - gw;

    // Season milestone context
    if (gw === halfwayGW) {
      leagueContextLines.push('This is GW' + gw + ' — the FINAL gameweek of the first half of the season. Chips reset next week (GW20). Everyone gets a fresh set of Wildcard, Bench Boost, Free Hit, and Triple Captain for the second half.');
    } else if (gw === halfwayGW - 1) {
      leagueContextLines.push('Only one gameweek left in the first half of the season. Chips reset after GW' + halfwayGW + ' — managers who haven\'t used their first-half chips are about to lose them forever.');
    } else if (gw < halfwayGW) {
      const gwsToHalf = halfwayGW - gw;
      if (gwsToHalf <= 3) leagueContextLines.push('The first half of the season ends in ' + gwsToHalf + ' gameweek' + (gwsToHalf > 1 ? 's' : '') + '. Chips reset at GW20 — use them or lose them.');
    } else if (gw === 20) {
      leagueContextLines.push('Welcome to the second half of the season! GW20 means everyone\'s chips have reset. A fresh Wildcard, Bench Boost, Free Hit, and Triple Captain for everyone — the second half starts now.');
    }
    if (gwsRemaining <= 5 && gwsRemaining > 0) {
      leagueContextLines.push('Only ' + gwsRemaining + ' gameweek' + (gwsRemaining > 1 ? 's' : '') + ' remaining in the season. The race for prizes is almost over.');
    }
    if (gw === totalGWs) {
      leagueContextLines.push('This is the FINAL gameweek of the season. Every point matters.');
    }

    // Cup context
    const allCupMatchesForPrompt = window._allCupMatches || [];
    const thisgwCupMatches = allCupMatchesForPrompt.filter(m => m.event === gw);
    if (thisgwCupMatches.length > 0) {
      const roundName = thisgwCupMatches[0].knockout_name || 'Cup Round';
      const completed = thisgwCupMatches.filter(m => m.winner);
      if (roundName.toLowerCase().includes('final') && !roundName.toLowerCase().includes('semi') && !roundName.toLowerCase().includes('quarter')) {
        leagueContextLines.push('THIS IS THE CUP FINAL! The biggest cup match of the season is happening this gameweek. Champion will be crowned.');
      } else if (roundName.toLowerCase().includes('semi')) {

      } else if (roundName.toLowerCase().includes('quarter')) {

      } else {
        leagueContextLines.push('The cup is active this gameweek (' + roundName + ').');
      }
    }

    const leagueContext = leagueContextLines.length > 0
      ? '\nLeague context for this gameweek:\n' + leagueContextLines.map(l => '- ' + l).join('\n') + '\n'
      : '';

    return `You are the snarky, brutally funny commissioner of a Fantasy Premier League league called "Fantasi Futbol". Write a roast-filled weekly recap for Gameweek ${gw}.
${leagueContext}
League rules:

Tone: funny, punchy, group-chat energy. Each section 2-4 sentences. No extra commentary outside the sections.`

  // Try to load recap from GitHub Pages recaps/ folder, fall back to localStorage
  async function loadSavedRecap(gw) {
    const season = 2025;
    const gwPadded = String(gw).padStart(2, '0');
    const filename = season + '-gw' + gwPadded + '.txt';
    try {
      const res = await fetch('recaps/' + filename + '?nocache=' + Date.now());
      if (res.ok) {
        const text = await res.text();
        if (text.trim()) return text.trim();
      }
    } catch(e) {}
    // Fall back to localStorage
    return localStorage.getItem('recap-gw-' + gw) || '';
  }

  function renderRecapDisplay(gw, text) {
    // Normalize: if text has **markdown**, use it; otherwise detect headers by pattern
    const hasMarkdown = /\*\*.+?\*\*/.test(text);

    const html = text
      .split('\n')
      .map(line => {
        const trimmed = line.trim();
        // Already markdown bold
        if (hasMarkdown) {
          line = line.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        } else {
          // Auto-detect headers: lines that are ALL CAPS (with spaces/punctuation/emoji)
          const stripped = trimmed.replace(/[\u{1F000}-\u{1FFFF}]/gu, '').trim();
          const isHeader = stripped.length > 4 && stripped.length < 100 && stripped === stripped.toUpperCase() && /[A-Z]/.test(stripped);
          if (isHeader) {
            line = '<strong>' + line + '</strong>';
          }
        }
        return line;
      })
      .join('\n')
      .replace(/\n/g, '<br>');

    // Format for WhatsApp: convert **header** to *header*, or auto-bold ALL CAPS headers
    const hasMarkdownWA = /\*\*.+?\*\*/.test(text);
    const plain = hasMarkdownWA
      ? text
          .replace(/\*\*(.+?)\*\*/g, '*$1*')
          .replace(/^(\*.+?\*)/gm, '\n$1')
          .replace(/\n{3,}/g, '\n\n')
          .trim()
      : text
          .split('\n')
          .map(line => {
            const trimmed = line.trim();
            const isHeader = (() => { const s = trimmed.replace(/[\uD83C-\uDBFF\uDC00-\uDFFF]/g,'').trim(); return s.length>4 && s.length<100 && s===s.toUpperCase() && /[A-Z]/.test(s); })() && trimmed.length < 100;
            return isHeader ? '\n*' + line.trim() + '*' : line;
          })
          .join('\n')
          .replace(/\n{3,}/g, '\n\n')
          .trim();
    const waUrl = 'https://wa.me/?text=' + encodeURIComponent(plain);

    document.getElementById('recap-display').innerHTML =
      '<div class="recap-card">' +
        '<div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:0.75rem;">' +
          '<div>' +
            '<div class="recap-gw-label">GW' + gw + ' RECAP</div>' +
            '<div class="recap-sub">Fantasi Futbol · GW' + gw + '</div>' +
          '</div>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
            '<button id="copy-recap-btn" class="btn" style="font-size:12px;padding:5px 12px;">Copy text</button>' +
            '<a id="wa-btn" href="' + waUrl + '" target="_blank" style="' +
              'display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 12px;' +
