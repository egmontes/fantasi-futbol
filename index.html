  async function setupRecapTab() {
    const gwVal = document.getElementById('gw-select').value;
    const isPreview = gwVal === 'preview';
    // Always use latestGW for recap — it reflects the most recently completed GW
    const gw = isPreview ? state.nextGW : (state.isLive ? state.liveGW : state.latestGW);

    // Live GW — show pending message
    if (state.isLive) {
      document.getElementById('recap-content').innerHTML = `
        <div style="text-align:center;padding:3rem 1rem;">
          <div style="font-size:2rem;margin-bottom:1rem;">⏳</div>
          <div style="font-size:16px;font-weight:600;color:var(--text);margin-bottom:8px;">GW${gw} Recap Pending</div>
          <div style="font-size:13px;color:var(--text3);max-width:360px;margin:0 auto;line-height:1.6;">
            The gameweek is still in progress. Come back once all matches are complete and scores are finalized.
          </div>
        </div>`;
      return;
    }

    // Load recap from GitHub recaps/ folder or localStorage
    const saved = await loadSavedRecap(gw);

    // Build HTML
    let html = '';

    // 1. SAVED RECAP — shown first if exists
    if (saved) {
      html += `<div id="recap-display" style="margin-bottom:2rem;"></div>`;
    }

    // 2. GENERATE SECTION — always present (collapsed behind "Need a new recap?" if saved)
    const generateLabel = saved ? 'Need a new recap?' : 'Generate GW' + gw + ' recap';
    const generateOpen = !saved;
    html += `
      <div style="margin-bottom:1rem;">
        <button id="toggle-generate-btn" style="
          background:none;border:none;cursor:pointer;padding:0;
          font-size:${saved ? '13px' : '14px'};
          color:${saved ? 'var(--text3)' : 'var(--text)'};
          font-weight:${saved ? '400' : '600'};
          display:flex;align-items:center;gap:6px;
        ">${saved ? '↩ ' + generateLabel : generateLabel}</button>
      </div>
      <div id="generate-section" style="display:${generateOpen ? 'block' : 'none'};">

        <div style="display:flex;gap:10px;align-items:center;margin-bottom:1rem;flex-wrap:wrap;">
          <button class="btn btn-primary" id="prepare-prompt-btn" style="background:var(--theme-dim);color:var(--theme);border-color:var(--theme-border);">Prepare GW${gw} prompt →</button>
          <span id="prepare-confirm" style="font-size:13px;color:var(--text3);display:none;"></span>
        </div>
        <div id="prompt-preview-area" style="display:none;margin-bottom:1.5rem;">
          <label style="font-size:12px;color:var(--text3);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.08em;display:block;margin-bottom:8px;">Prompt ready — select all and copy</label>
          <textarea id="prompt-preview" readonly style="
            width:100%;min-height:120px;background:var(--bg2);color:var(--text2);
            border:1px solid var(--border2);border-radius:8px;padding:12px;
            font-family:var(--font-mono);font-size:12px;line-height:1.5;resize:vertical;
          "></textarea>
          <div style="display:flex;gap:10px;margin-top:8px;">
            <button class="btn btn-primary" id="copy-prompt-btn">Copy to clipboard</button>
            <span id="copy-confirm" style="font-size:13px;color:var(--green);display:none;">✓ Copied!</span>
          </div>
        </div>
        <div style="margin-bottom:1.5rem;">
          <label style="font-size:12px;color:var(--text3);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.08em;display:block;margin-bottom:8px;">Paste recap here</label>
          <textarea id="recap-paste" placeholder="Paste the recap from Claude here..." style="
            width:100%;min-height:220px;background:var(--bg2);color:var(--text);
            border:1px solid var(--border2);border-radius:8px;padding:12px;
            font-family:var(--font-body);font-size:14px;line-height:1.6;resize:vertical;
          ">${esc(saved || '')}</textarea>
          <div style="display:flex;gap:10px;margin-top:10px;">
            <button class="btn btn-primary" id="save-recap-btn" style="background:var(--theme-dim);color:var(--theme);border-color:var(--theme-border);">Save recap</button>
            <button class="btn" id="clear-recap-btn" style="${saved ? '' : 'display:none'}">Clear</button>
          </div>
        </div>
      </div>`;

    // 3. PROMPT INSTRUCTIONS — subtle collapsible at bottom
    html += `
      <div style="margin-top:3rem;padding-top:1rem;border-top:1px solid var(--border);">
        <button id="toggle-instructions-btn" style="
          background:none;border:none;cursor:pointer;padding:0;
          font-size:11px;color:var(--text3);font-family:var(--font-mono);
          text-transform:uppercase;letter-spacing:0.06em;
          display:flex;align-items:center;gap:4px;
        ">▸ How to use</button>
        <div id="instructions-section" style="display:none;margin-top:10px;">
          <p style="font-size:13px;color:var(--text3);line-height:1.6;margin:0;">
            Copy the prompt below, paste it into <a href="https://claude.ai" target="_blank" style="color:var(--theme)">claude.ai</a>, then paste the response back here. Hitting <strong style="color:var(--text2);">Save recap</strong> will display it and automatically download a <code style="font-family:var(--font-mono);font-size:12px;color:var(--theme);">2025-gw${gw}.txt</code> file — drag that into your <code style="font-family:var(--font-mono);font-size:12px;color:var(--theme);">recaps/</code> folder and push to GitHub.
          </p>
        </div>
      </div>`;

    document.getElementById('recap-content').innerHTML = html;

    // Render saved recap immediately if exists
    if (saved) {
      renderRecapDisplay(gw, saved);
    }

    // Toggle generate section
    document.getElementById('toggle-generate-btn').addEventListener('click', () => {
      const sec = document.getElementById('generate-section');
      const btn = document.getElementById('toggle-generate-btn');
      const open = sec.style.display !== 'none';
      sec.style.display = open ? 'none' : 'block';
      if (saved) btn.textContent = (open ? '↩ ' : '↪ ') + generateLabel;
    });

    // Toggle instructions
    document.getElementById('toggle-instructions-btn').addEventListener('click', () => {
      const sec = document.getElementById('instructions-section');
      const btn = document.getElementById('toggle-instructions-btn');
      const open = sec.style.display !== 'none';
      sec.style.display = open ? 'none' : 'block';
      btn.textContent = (open ? '▸' : '▾') + ' How to use';
    });

    // Step 1: fetch data and populate textarea
    document.getElementById('prepare-prompt-btn').addEventListener('click', async () => {
      const btn = document.getElementById('prepare-prompt-btn');
      const status = document.getElementById('prepare-confirm');
      if (btn.disabled) return;
      
      // Use the GW the current page is showing
      const currentGW = state.isLive ? state.liveGW : state.latestGW;
      
      btn.disabled = true;
      btn.textContent = 'Fetching player data...';
      status.textContent = 'Fetching full player data for all managers...';
      status.style.display = 'inline';
      try {
        const prompt = await buildPrompt(currentGW);
        document.getElementById('prompt-preview').value = prompt;
        document.getElementById('prompt-preview-area').style.display = 'block';
        status.textContent = '✓ Ready to copy!';
        btn.textContent = 'Refresh prompt →';
        // Auto-select the textarea
        const ta = document.getElementById('prompt-preview');
        ta.focus();
        ta.select();
      } catch(e) {
        status.textContent = '✗ Failed: ' + e.message;
      }
      btn.disabled = false;
    });

    // Step 2: copy from textarea (direct user gesture — clipboard always works)
    document.getElementById('recap-content').addEventListener('click', (e) => {
      if (e.target.id !== 'copy-prompt-btn') return;
      const ta = document.getElementById('prompt-preview');
      if (!ta || !ta.value) return;
      navigator.clipboard.writeText(ta.value).then(() => {
        const confirm = document.getElementById('copy-confirm');
        confirm.style.display = 'inline';
        setTimeout(() => confirm.style.display = 'none', 2500);
      }).catch(() => {
        // Fallback: select the text so user can Cmd+C
        ta.focus();
        ta.select();
        document.execCommand('copy');
        const confirm = document.getElementById('copy-confirm');
        confirm.style.display = 'inline';
        setTimeout(() => confirm.style.display = 'none', 2500);
      });
    });

    document.getElementById('save-recap-btn').addEventListener('click', () => {
      const text = document.getElementById('recap-paste').value.trim();
      if (!text) return;

      // Save to localStorage
      localStorage.setItem('recap-gw-' + gw, text);

      // Ensure recap-display exists at top
      if (!document.getElementById('recap-display')) {
        const recapDisplay = document.createElement('div');
        recapDisplay.id = 'recap-display';
        recapDisplay.style.marginBottom = '2rem';
        document.getElementById('recap-content').prepend(recapDisplay);
      }
      renderRecapDisplay(gw, text);
      document.getElementById('clear-recap-btn').style.display = 'inline-block';

      // Auto-download the .txt file with correct naming
      const season = 2025;
      const gwPadded = String(gw).padStart(2, '0');
      const filename = season + '-gw' + gwPadded + '.txt';
      const blob = new Blob([text], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);

      // Show download confirmation
      const btn = document.getElementById('save-recap-btn');
      const orig = btn.textContent;
      btn.textContent = '✓ Saved & downloaded ' + filename;
      setTimeout(() => btn.textContent = orig, 3000);
    });

    document.getElementById('clear-recap-btn').addEventListener('click', () => {
      localStorage.removeItem(`recap-gw-${gw}`);
      document.getElementById('recap-paste').value = '';
      document.getElementById('recap-display').innerHTML = '';
      document.getElementById('clear-recap-btn').style.display = 'none';
    });
  }

    function esc(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ── URL HASH STATE ─────────────────────────────────────────────────────
  function getHashState() {
    const hash = window.location.hash.slice(1);
    const parts = hash.split('/');
    return { tab: parts[0] || 'standings', gw: parts[1] || null };
  }

  function setHashState(tab, gw) {
    const gwVal = gw || document.getElementById('gw-select').value;
    window.location.replace('#' + tab + (gwVal ? '/' + gwVal : ''));
  }

  // Restore state from hash on load
  function restoreHashState() {
    const { tab, gw } = getHashState();

    // Set GW select
    const gwSel = document.getElementById('gw-select');
    if (gw) {
      // Check if the option exists
      const opt = Array.from(gwSel.options).find(o => o.value === gw);
      if (opt) gwSel.value = gw;
    }

    // Set active tab
    const btn = document.querySelector(`.tab-btn[data-tab="${tab}"]`);
    if (btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      btn.classList.add('active');
      const section = document.getElementById('tab-' + tab);
      if (section) section.classList.add('active');
      // Show/hide toggle bar and gw-bar based on tab
      const gwBarEl = document.querySelector('.gw-bar');
      const toggleBarEl = document.getElementById('standings-toggle-bar');
      if (gwBarEl) gwBarEl.classList.toggle('hidden', tab === 'standings' || tab === 'cup');
      if (toggleBarEl) toggleBarEl.style.display = tab === 'standings' ? 'flex' : 'none';
      const weeklyToggleEl = document.getElementById('weekly-toggle-bar');
      if (weeklyToggleEl) weeklyToggleEl.style.display = tab === 'weekly' ? 'flex' : 'none';
      return tab;
    }
    // Default — standings is active, hide gw-bar, show toggle
    const gwBarEl = document.querySelector('.gw-bar');
    if (gwBarEl) gwBarEl.classList.add('hidden');
    const toggleBarEl = document.getElementById('standings-toggle-bar');
    if (toggleBarEl) toggleBarEl.style.display = 'flex';
    return 'standings';
  }
  // ── END URL HASH STATE ───────────────────────────────────────────────────

  // TAB SWITCHING
  // ── CUP ──────────────────────────────────────────────────────────────────
  const ROUND_NAMES = {
    1: 'Round of 64', 2: 'Round of 32', 3: 'Round of 16',
    4: 'Quarter-finals', 5: 'Semi-finals', 6: 'Final'
  };

  async function loadCupData() {
    document.getElementById('cup-content').innerHTML =
      '<div class="loading-state"><span class="spinner"></span>Loading cup data...</div>';
    try {
      let allMatches = [];
      const seen = new Set();

      // Get cup_league ID from the classic league standings
      let cupLeagueId = null;
      try {
        const leagueData = await fetchFPL('leagues-classic/' + LEAGUE_ID + '/standings/');
        cupLeagueId = leagueData.league && leagueData.league.cup_league;
        console.log('Cup league ID:', cupLeagueId);
      } catch(e) {
        console.warn('Could not fetch league info:', e.message);
      }

      // The correct FPL cup matches endpoint uses leagues-h2h-matches
      if (cupLeagueId) {
        try {
          let page = 1;
          while (true) {
            const data = await fetchFPL('leagues-h2h-matches/league/' + cupLeagueId + '/?page=' + page);
            const matches = data.results || [];
            matches.forEach(m => {
              const key = [m.entry_1_entry, m.entry_2_entry, m.event].sort().join('-');
              if (!seen.has(key)) { seen.add(key); allMatches.push(m); }
            });
            if (!data.has_next || matches.length === 0) break;
            page++;
          }
        } catch(e) {
          console.warn('Cup h2h endpoint failed:', e.message);
        }
      }

      console.log('Total cup matches found:', allMatches.length);
      if (allMatches.length > 0) console.log('Sample:', JSON.stringify(allMatches[0]));
      window._allCupMatches = allMatches;
      renderCup(allMatches);
    } catch(e) {
      document.getElementById('cup-content').innerHTML =
        '<div class="error-state">Failed to load cup data.<small>' + e.message + '</small></div>';
    }
  }

  let _selectedCupRound = null;

  function renderCup(allMatches) {
    const rounds = {};
    const managerById = {};
    state.managers.forEach(m => { managerById[m.id] = m; });

    allMatches.forEach(match => {
      const event = match.event;
      if (!rounds[event]) rounds[event] = [];
      rounds[event].push(match);
    });

    const roundEvents = Object.keys(rounds).map(Number).sort((a, b) => a - b);

    const seedRanked = [...state.managers]
      .map(m => ({ id: m.id, total: m.total }))
      .sort((a, b) => b.total - a.total);
    const seedMap = {};
    let seedRank = 1;
    seedRanked.forEach((m, i) => {
      if (i > 0 && seedRanked[i].total < seedRanked[i-1].total) seedRank = i + 1;
      seedMap[m.id] = seedRank;
    });

    if (roundEvents.length === 0) {
      document.getElementById('cup-content').innerHTML =
        '<div class="loading-state" style="color:var(--text3);">No cup data found. The cup may not have started yet for this league.</div>';
      return;
    }

    // Default to most recent round
    if (!_selectedCupRound || !rounds[_selectedCupRound]) {
      _selectedCupRound = roundEvents[roundEvents.length - 1];
    }

    // Check for winner
    let cupWinner = null;
    const lastRoundMatches = rounds[roundEvents[roundEvents.length - 1]] || [];
    lastRoundMatches.forEach(m => {
      if (m.winner) {
        const wm = state.managers.find(mgr => mgr.id === m.winner);
        if (wm) cupWinner = wm;
      }
    });

    const displayRounds = [...roundEvents].reverse(); // most recent first
    const totalRounds = displayRounds.length;

    // Build round selector badges
    let html = '';

    if (cupWinner) {
      html += '<div class="cup-winner-card">' +
        '<div class="cup-trophy">🏆</div>' +
        '<div class="cup-winner-name">' + esc(cupWinner.name) + '</div>' +
        '<div class="cup-winner-team">' + esc(cupWinner.team) + ' — Cup Champion</div>' +
        '</div>';
    }

    html += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1.5rem;">';
    displayRounds.forEach((event, idx) => {
      const roundNum = totalRounds - idx;
      const roundName = ROUND_NAMES[roundNum] || ('Round ' + roundNum);
      const isSelected = event === _selectedCupRound;
      html += '<button class="cup-round-btn" data-event="' + event + '" style="' +
        'padding:6px 14px;border-radius:20px;font-size:12px;font-family:var(--font-mono);cursor:pointer;border:1px solid ' +
        (isSelected ? 'var(--theme)' : 'var(--border2)') + ';' +
        'background:' + (isSelected ? 'var(--theme-dim)' : 'var(--surface)') + ';' +
        'color:' + (isSelected ? 'var(--theme)' : 'var(--text2)') + ';' +
        'font-weight:' + (isSelected ? '600' : '400') + ';' +
        '">' + roundName + ' · GW' + event + '</button>';
    });
    html += '</div>';

    // Render only selected round
    const matches = rounds[_selectedCupRound];
    const selectedIdx = displayRounds.indexOf(_selectedCupRound);
    const selectedRoundNum = totalRounds - selectedIdx;
    const selectedRoundName = ROUND_NAMES[selectedRoundNum] || ('Round ' + selectedRoundNum);

    html += '<div id="cup-round-matches"><div class="cup-matches">';

    const sortedMatches = [...matches].sort((a, b) => {
      const a1 = state.managers.find(m => m.id === a.entry_1_entry);
      const a2 = state.managers.find(m => m.id === a.entry_2_entry);
      const b1 = state.managers.find(m => m.id === b.entry_1_entry);
      const b2 = state.managers.find(m => m.id === b.entry_2_entry);
      const aIsBye = !a2, bIsBye = !b2;
      if (aIsBye && !bIsBye) return 1;
      if (!aIsBye && bIsBye) return -1;
      const aBestSeed = Math.min(seedMap[a1?.id] || 999, seedMap[a2?.id] || 999);
      const bBestSeed = Math.min(seedMap[b1?.id] || 999, seedMap[b2?.id] || 999);
      return aBestSeed - bBestSeed;
    });

    sortedMatches.forEach(match => {
      const m1 = state.managers.find(m => m.id === match.entry_1_entry);
      const m2 = state.managers.find(m => m.id === match.entry_2_entry);
      const currentGW = state.isLive ? state.liveGW : state.latestGW;
      const isCurrentGW = match.event === currentGW;
      const liveScores = (window._liveScoreCacheGW || {})[currentGW] || {};
      // Use live scores for current GW, otherwise use stored FPL points
      const pts1 = (isCurrentGW && liveScores[match.entry_1_entry])
        ? liveScores[match.entry_1_entry].netPts
        : match.entry_1_points;
      const pts2 = (isCurrentGW && liveScores[match.entry_2_entry])
        ? liveScores[match.entry_2_entry].netPts
        : match.entry_2_points;
      const winner = match.winner;
      const isPlayed = !!winner; // only consider played when a winner is confirmed

      const getHit = (managerId, event) => {
        const hist = state.gwHistory[managerId] || [];
        const entry = hist.find(h => h.event === event);
        return entry ? entry.event_transfers_cost : 0;
      };

      const row = (manager, pts, isWinner, isBye, event, showPts) => {
        if (!manager) return '';
        const rowClass = !isPlayed ? '' : isWinner ? ' winner' : ' loser';
        const ptsClass = isWinner ? ' high' : '';
        const badge = isWinner ? ' <span class="cup-winner-badge">✓</span>' : '';
        const hit = manager && event ? getHit(manager.id, event) : 0;
        const rawPts = pts !== null ? pts + hit : null;
        const hitStr = hit > 0 ? '<span class="hit-cost">(-' + hit + ')</span>' : '';
        const seed = seedMap[manager.id] || '?';
        const managerColor = !isPlayed ? 'var(--text)' : isWinner ? 'var(--text)' : 'inherit';
        return '<div class="cup-match-row' + rowClass + (isBye ? ' bye' : '') + '">' +
          '<div style="display:flex;align-items:center;gap:8px;">' +
          '<span style="font-size:11px;color:var(--theme);font-family:var(--font-mono);min-width:18px;text-align:right;">' + seed + '</span>' +
          '<div><div class="cup-manager" style="color:' + managerColor + ';">' + esc(manager.name) + badge + '</div>' +
          '<div style="font-size:11px;color:var(--theme);">' + esc(manager.team) + '</div></div>' +
          '</div>' +
          (showPts && rawPts !== null ? '<div class="cup-pts' + ptsClass + '">' + rawPts + hitStr + '</div>' : '') +
          '</div>';
      };

      let topManager = m1, topPts = pts1, botManager = m2, botPts = pts2;
      if (m1 && m2 && (seedMap[m2.id] || 999) < (seedMap[m1.id] || 999)) {
        topManager = m2; topPts = pts2; botManager = m1; botPts = pts1;
      }
      html += '<div class="cup-match">';
      if (topManager) html += row(topManager, topPts, winner === topManager.id, false, match.event, isPlayed || isCurrentGW);
      if (botManager) html += row(botManager, botPts, winner === botManager.id, false, match.event, isPlayed || isCurrentGW);
      else html += '<div class="cup-match-row bye"><div class="cup-manager">BYE</div></div>';
      const hasScores = (pts1 !== null && pts1 > 0) || (pts2 !== null && pts2 > 0);
      if (!isPlayed && !hasScores) html += '<div class="cup-status">Upcoming</div>';
      html += '</div>';
    });

    html += '</div></div>';

    document.getElementById('cup-content').innerHTML = html;

  // STICKY TABLE HEADERS

    // ── FLOATING TABLE HEADER ──────────────────────────────────────────────
  let _fhScrollContainer = null;

  function initFloatingHeader(tableId) {
    const table = document.getElementById(tableId);
    if (!table) return;
    const outer = (() => { let el = table.parentElement; while(el && !el.classList.contains('table-outer')) el = el.parentElement; return el; })();
    const thead = table.querySelector('thead');
    if (!thead || !outer) return;

    const fh = document.getElementById('floating-header');
    const fhLeft = document.getElementById('fh-left');
    const fhRightTable = document.getElementById('fh-right-table');
    const fhRow = document.getElementById('floating-header-row');

    // Get real ths
    const realThs = Array.from(thead.querySelectorAll('th'));
    if (realThs.length < 2) return;

    // Build LEFT section — fixed # and Manager columns as plain divs
    fhLeft.innerHTML = '';
    const leftCols = realThs.slice(0, 2);
    leftCols.forEach((th, i) => {
      const div = document.createElement('div');
      div.style.cssText = `display:flex;align-items:center;padding:8px 10px;font-size:11px;color:var(--theme);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.08em;white-space:nowrap;background:var(--bg2);border-bottom:1px solid var(--border);box-sizing:border-box;`;
      div.textContent = th.textContent;
      if (th.dataset.col) div.addEventListener('click', () => th.click());
      fhLeft.appendChild(div);
    });

    // Build RIGHT section — remaining columns in a scrollable table
    fhRow.innerHTML = '';
    const tr = document.createElement('tr');
    realThs.slice(2).forEach((th, i) => {
      const clone = th.cloneNode(true);
      clone.style.color = 'var(--theme)';
      if (th.dataset.col) clone.addEventListener('click', () => th.click());
      tr.appendChild(clone);
    });
    fhRow.appendChild(tr);

    function sync() {
      const toggleBar = document.getElementById('standings-toggle-bar');
      const weeklyToggleBar = document.getElementById('weekly-toggle-bar');
      const gwBar = document.querySelector('.gw-bar');
      const tabsBottom =
        (weeklyToggleBar && weeklyToggleBar.style.display !== 'none' ? weeklyToggleBar.getBoundingClientRect().bottom : 0) ||
        (toggleBar && toggleBar.style.display !== 'none' ? toggleBar.getBoundingClientRect().bottom : 0) ||
        (gwBar && !gwBar.classList.contains('hidden') ? gwBar.getBoundingClientRect().bottom : 0) ||
        document.querySelector('.tabs')?.getBoundingClientRect().bottom || 157;
      const theadRect = thead.getBoundingClientRect();
      const outerRect = outer.getBoundingClientRect();

      if (theadRect.bottom < tabsBottom) {
        const fhHeight = realThs[0].getBoundingClientRect().height || 36;

        fh.style.top = tabsBottom + 'px';
        fh.style.left = outerRect.left + 'px';
        fh.style.right = (window.innerWidth - outerRect.right) + 'px';
        fh.style.height = fhHeight + 'px';
        fh.style.overflow = 'hidden';

        // Size left fixed columns
        let leftWidth = 0;
        leftCols.forEach((th, i) => {
          const w = th.getBoundingClientRect().width;
          fhLeft.children[i].style.width = w + 'px';
          fhLeft.children[i].style.height = fhHeight + 'px';
          leftWidth += w;
        });
        fhLeft.style.width = leftWidth + 'px';

        // Right section fills full width, table starts at leftWidth via transform offset
        const rightDiv = fhRightTable.parentElement;
        const leftWidthCeil = Math.ceil(leftWidth);
        rightDiv.style.position = 'absolute';
        rightDiv.style.left = Math.max(0, leftWidthCeil - 1) + 'px';
        rightDiv.style.right = '0';
        rightDiv.style.top = '0';
        rightDiv.style.bottom = '0';
        rightDiv.style.overflow = 'hidden';

        // Sync widths for right columns
        const rightThs = realThs.slice(2);
        tr.querySelectorAll('th').forEach((th, i) => {
          if (rightThs[i]) th.style.width = rightThs[i].getBoundingClientRect().width + 'px';
        });

        // Sync horizontal scroll for right section only
        fhRightTable.style.transform = 'translateX(-' + outer.scrollLeft + 'px)';

        fh.classList.add('visible');
      } else {
        fh.classList.remove('visible');
      }
    }

    function syncScroll() {
      if (!fh.classList.contains('visible')) return;
      fhRightTable.style.transform = 'translateX(-' + outer.scrollLeft + 'px)';
    }

    if (_fhScrollContainer) {
      _fhScrollContainer.removeEventListener('scroll', _fhScrollContainer._syncScroll);
    }
    _fhScrollContainer = outer;
    outer._syncScroll = syncScroll;
    outer.addEventListener('scroll', syncScroll, { passive: true });
    window.addEventListener('scroll', sync, { passive: true });
    window.addEventListener('resize', sync, { passive: true });
    window.addEventListener('touchmove', sync, { passive: true });

    sync();
  }

  // ── DYNAMIC STICKY OFFSETS ──────────────────────────────────────────────
  function updateStickyOffsets() {
    const header = document.querySelector('.site-header');
    const callout = document.getElementById('gw-callout');
    const gwBar = document.querySelector('.gw-bar');
    const tabs = document.querySelector('.tabs');
    if (!header || !gwBar || !tabs) return;

    const headerH = header.offsetHeight;
    const calloutH = callout ? callout.offsetHeight : 0;
    const tabsH = tabs.offsetHeight;
    const gwBarH = (gwBar && !gwBar.classList.contains('hidden')) ? gwBar.offsetHeight : 0;

    document.documentElement.style.setProperty('--header-h', headerH + 'px');
    document.documentElement.style.setProperty('--sticky-tabs-top', (headerH + calloutH) + 'px');
    document.documentElement.style.setProperty('--sticky-gw-bar-top', (headerH + calloutH + tabsH) + 'px');
    document.documentElement.style.setProperty('--gwbar-h', gwBarH + 'px');
    const toggleBar = document.getElementById('standings-toggle-bar');
    const toggleBarH = (toggleBar && toggleBar.style.display !== 'none') ? toggleBar.offsetHeight : 0;
    const weeklyToggleBar = document.getElementById('weekly-toggle-bar');
    const weeklyToggleBarH = (weeklyToggleBar && weeklyToggleBar.style.display !== 'none') ? weeklyToggleBar.offsetHeight : 0;


    // standings toggle bar sits right below the tabs (no gw-bar on standings)
    const toggleTop = headerH + calloutH + tabsH;
    document.documentElement.style.setProperty('--sticky-toggle-top', toggleTop + 'px');
    const gwBarBottom = headerH + calloutH + tabsH + gwBarH;
    document.documentElement.style.setProperty('--sticky-gw-bar-bottom', gwBarBottom + 'px');

    const contentTop = headerH + calloutH + tabsH + gwBarH + toggleBarH + weeklyToggleBarH;
    document.documentElement.style.setProperty('--sticky-thead-top', contentTop + 'px');
    const finalContentTop = contentTop + 4;
    document.documentElement.style.setProperty('--content-top', finalContentTop + 'px');
    // Also set directly on the container so it takes effect immediately
    const container = document.querySelector('.container');
    if (container) container.style.paddingTop = finalContentTop + 'px';
  }

  window.addEventListener('resize', () => {
    updateStickyOffsets();
    // Re-run after a frame to catch any reflow from resize
    requestAnimationFrame(updateStickyOffsets);
  }, { passive: true });
  // ── END DYNAMIC STICKY OFFSETS ───────────────────────────────────────────

  function initPullToRefresh() {
    const bar = document.getElementById('ptr-bar');
    const indicator = document.getElementById('ptr-indicator');
    const THRESHOLD = 80;
    let startY = 0, pulling = false, triggered = false;

    document.addEventListener('touchstart', e => {
      if (window.scrollY === 0) {
        startY = e.touches[0].clientY;
        pulling = true;
        triggered = false;
      }
    }, { passive: true });

    document.addEventListener('touchmove', e => {
      if (!pulling) return;
      const dy = e.touches[0].clientY - startY;
      if (dy <= 0) { pulling = false; return; }
      // Prevent browser's native pull-to-refresh
      if (dy > 0 && window.scrollY === 0) e.preventDefault();
      if (dy > 10) {
        indicator.classList.add('ptr-visible');
        indicator.textContent = dy >= THRESHOLD ? '↑ Release to refresh' : '↓ Pull to refresh';
      }
    }, { passive: false });

    document.addEventListener('touchend', async e => {
      if (!pulling) return;
      pulling = false;
      const dy = e.changedTouches[0].clientY - startY;
      indicator.classList.remove('ptr-visible');
      if (dy < THRESHOLD || triggered) return;
      triggered = true;
      bar.classList.add('ptr-loading');
      try {
        // Always fetch fresh bootstrap on PTR — bypass cache
        localStorage.removeItem('ff_bootstrap');
        localStorage.removeItem('ff_bootstrap_ts');
        const bootstrap = await fetchFPL('bootstrap-static/');
        bootstrap.elements.forEach(p => { state.bootstrapPlayers[p.id] = p.web_name; });
        const finished = bootstrap.events.filter(ev => ev.finished || ev.data_checked);
        const newLatest = finished.length > 0 ? finished[finished.length - 1].id : 1;
        if (newLatest !== state.latestGW) {
          window.location.reload();
        } else {
          const currentGW = state.isLive ? state.liveGW : state.latestGW;
          if (window._liveScoreCacheGW) delete window._liveScoreCacheGW[currentGW];
          window._liveScoreFetchInProgress = false;
          renderStandings();
          const gwVal = document.getElementById('gw-select')?.value;
          if (gwVal && gwVal !== 'preview') renderWeekly(parseInt(gwVal));
        }
      } catch(err) { console.warn('PTR error:', err); }
      bar.classList.remove('ptr-loading');
    }, { passive: true });
  }

  function renderLeagueHistory(seasonData, seasonLabels) {
    const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const toArr = v => !v ? [] : Array.isArray(v) ? v : [v];

    // Aggregate per manager
    const managers = {};
    seasonLabels.forEach(label => {
      const data = seasonData[label];
      if (!data) return;
      const league = data.awards?.League || {};
      const cup = data.awards?.Cup || {};
      data.managers.forEach(m => {
        if (!managers[m.name]) managers[m.name] = {
          name: m.name, seasons: 0, earned: 0, guinness: 0,
          top1: 0, top2: 0, top3: 0, top4: 0, last: 0,
          leagueTitles: 0, leagueRunnerUp: 0, cupTitles: 0, cupRunnerUp: 0,
          s1st: 0, s2nd: 0, s3rd: 0, s4th: 0, s5th: 0,
          seasonResults: {}
        };
        const s = managers[m.name];
        s.seasons++; s.earned += m.earned||0; s.guinness += m.guinness||0;
        s.top1 += m.top1||0; s.top2 += m.top2||0; s.top3 += m.top3||0;
        s.top4 += m.top4||0; s.last += m.last||0;
        let badge = '';
        if (league.winner === m.name) { badge += '🥇'; s.leagueTitles++; s.s1st++; }
        else if (toArr(league.runner_up).includes(m.name)) { badge += '🥈'; s.leagueRunnerUp++; s.s2nd++; }
        else if (toArr(league.third).includes(m.name)) { s.s3rd++; }
        else if (toArr(league.fourth).includes(m.name)) { s.s4th++; }
        else if (toArr(league.fifth).includes(m.name)) { s.s5th++; }
        if (cup.winner === m.name) { badge += '🏆'; s.cupTitles++; }
        else if (toArr(cup.runner_up).includes(m.name)) { badge += '🥈'; s.cupRunnerUp++; }
        s.seasonResults[label] = { earned: m.earned||0, badge };
      });
    });

    const ranked = Object.values(managers);
    const { col, dir } = window._historySort || { col: 'earned', dir: -1 };
    ranked.sort((a, b) => {
      let av, bv;
      if (col.startsWith('season_')) {
        const label = col.replace('season_', '').replace('_', '/');
        av = a.seasonResults[label]?.earned ?? -1;
        bv = b.seasonResults[label]?.earned ?? -1;
      } else {
        av = a[col] ?? 0; bv = b[col] ?? 0;
      }
      return typeof av === 'string' ? dir * av.localeCompare(bv) : dir * (av - bv);
    });

    const arrow = c => window._historySort?.col === c ? (window._historySort.dir === -1 ? ' sort-desc' : ' sort-asc') : '';
    const th = (c, label, w) => `<th class="sortable${arrow(c)}" onclick="window._historySortBy('${c}')" style="width:${w};padding:8px 6px;text-align:center;color:var(--theme);font-weight:600;font-family:var(--font-mono);font-size:11px;cursor:pointer;">${label}</th>`;

    // Leader widgets
    const byEarned = [...ranked].sort((a,b) => b.earned - a.earned)[0];
    const byTitles = [...ranked].sort((a,b) => b.leagueTitles - a.leagueTitles)[0];

  // Season selector — exposed globally for onclick handlers
  // ── GW CACHE EXPORT ─────────────────────────────────────────────────────
  async function exportGWCache(gw) {
    const btn = document.getElementById('export-gw-btn');
    if (btn) { btn.textContent = 'Exporting...'; btn.disabled = true; }

    try {
      // Fetch full picks + live data for all managers
      const liveData = await fetchFPL('event/' + gw + '/live/');
      const playerPts = {};
      liveData.elements.forEach(e => { playerPts[e.id] = e.stats.total_points; });

      const chips = await fetchChipsForGW(gw);
      const captains = _captainCache[gw] || {};

      const managersData = [];
      const BATCH = 5;
      for (let i = 0; i < state.managers.length; i += BATCH) {
        const batch = state.managers.slice(i, i + BATCH);
        await Promise.all(batch.map(async m => {
          try {
            const [picks, transfers] = await Promise.all([
              fetchFPL('entry/' + m.id + '/event/' + gw + '/picks/'),
              fetchFPL('entry/' + m.id + '/transfers/')
            ]);
            const hist = (state.gwHistory[m.id] || []).find(h => h.event === gw);
            const gwTransfers = transfers.filter(t => t.event === gw);

            managersData.push({
              id: m.id,
              name: m.name,
              team: m.team,
              history: {
                points: hist?.points || 0,
                total_points: hist?.total_points || 0,
                event_transfers: hist?.event_transfers || 0,
                event_transfers_cost: hist?.event_transfers_cost || 0,
                points_on_bench: hist?.points_on_bench || 0,
              },
              captain: captains[m.id] || null,
              chip: chips[m.id] || null,
              picks: picks.picks,
              transfers: gwTransfers.map(t => ({
                element_in: t.element_in,
                element_in_name: state.bootstrapPlayers[t.element_in] || '',
                element_out: t.element_out,
                element_out_name: state.bootstrapPlayers[t.element_out] || '',
                element_in_pts: playerPts[t.element_in] || 0,
                element_out_pts: playerPts[t.element_out] || 0,
              })),
            });
          } catch(e) {
            console.warn('Failed to export manager', m.name, e.message);
          }
        }));
      }

      // Build player lookup (only players that appear in picks)
      const usedPlayerIds = new Set();
      managersData.forEach(m => m.picks.forEach(p => usedPlayerIds.add(p.element)));
      const players = {};
      liveData.elements.forEach(e => {
        if (usedPlayerIds.has(e.id)) {
          players[e.id] = {
            name: state.bootstrapPlayers[e.id] || '',
            team: state.playerTeams?.[e.id] || null,
            type: state.bootstrap?.elements?.find(el => el.id === e.id)?.element_type || null,
            pts: e.stats.total_points,
          };
        }
      });

      const cache = {
        gw,
        season: '2025/2026',
        exported: new Date().toISOString(),
        players,
        cupMatches: (window._allCupMatches || []).filter(m => m.event === gw),
        managers: managersData.sort((a, b) => b.history.points - a.history.points),
      };

      // Download as JSON file
      const blob = new Blob([JSON.stringify(cache, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'gw' + String(gw).padStart(2, '0') + '.json';
      a.click();
      URL.revokeObjectURL(url);

      if (btn) { btn.textContent = '✓ Saved GW' + gw; btn.disabled = false; }
    } catch(e) {
      console.error('Export failed:', e);
      if (btn) { btn.textContent = 'Export failed'; btn.disabled = false; }
    }
  }
  window._exportGWCache = exportGWCache;
  // ── END GW CACHE EXPORT ──────────────────────────────────────────────────
  // ── GW CACHE LOADER ──────────────────────────────────────────────────────
  const _gwCacheLoaded = {};

  async function loadGWFromCache(gw) {
    if (_gwCacheLoaded[gw]) return true;
    try {
      const res = await fetch('data/2025-2026/gw' + String(gw).padStart(2, '0') + '.json?nocache=' + Date.now());
      if (!res.ok) return false;
      const cache = await res.json();

      // Hydrate player lookup
      Object.entries(cache.players || {}).forEach(([id, p]) => {
        state.bootstrapPlayers[parseInt(id)] = p.name;
        if (p.team) { state.playerTeams = state.playerTeams || {}; state.playerTeams[parseInt(id)] = p.team; }
      });

      // Hydrate cup matches
      if (cache.cupMatches && cache.cupMatches.length > 0) {
        if (!window._allCupMatches) window._allCupMatches = [];
        const existingEvents = new Set(window._allCupMatches.map(m => m.event + '-' + m.entry_1_entry + '-' + m.entry_2_entry));
        cache.cupMatches.forEach(m => {
          const key = m.event + '-' + m.entry_1_entry + '-' + m.entry_2_entry;
          if (!existingEvents.has(key)) window._allCupMatches.push(m);
        });
      }

      // Hydrate gwHistory, _captainCache, _chipCache, _picksCache for this GW
      cache.managers.forEach(m => {
        if (!state.gwHistory[m.id]) state.gwHistory[m.id] = [];
        const existing = state.gwHistory[m.id].findIndex(h => h.event === gw);
        const entry = { event: gw, ...m.history };
        if (existing >= 0) state.gwHistory[m.id][existing] = entry;
        else state.gwHistory[m.id].push(entry);

        if (m.captain) {
          if (!_captainCache[gw]) _captainCache[gw] = {};
          _captainCache[gw][m.id] = m.captain;
        }
        if (m.chip !== undefined) {
          if (!_chipCache[gw]) _chipCache[gw] = {};
          _chipCache[gw][m.id] = m.chip;
        }
        if (m.picks) {
          window._picksCache = window._picksCache || {};
          window._picksCache[m.id + '_' + gw] = { picks: m.picks, active_chip: m.chip, transfers: m.transfers };
        }
      });

      _gwCacheLoaded[gw] = true;
      console.log('✓ GW' + gw + ' loaded from static cache (data/2025-2026/gw' + String(gw).padStart(2,'0') + '.json)');
      // Show indicator in export button
      const btn = document.getElementById('export-gw-btn');
      if (btn) {
        btn.textContent = '✓ GW' + gw + ' (saved)';
        btn.style.color = 'var(--green)';
        btn.style.borderColor = 'var(--green)';
        btn.style.background = 'rgba(0,200,100,0.1)';
        btn.style.display = 'inline-flex';
      }
      return true;
    } catch(e) {
      return false;
    }
  }

  function renderHistoricalSeason(data) {
    const esc = s => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const toArr = v => !v ? [] : Array.isArray(v) ? v : [v];
    const { season, managers, awards, entry_fee, num_players } = data;
    const league = awards?.League || {};
    const cup = awards?.Cup || {};
    const has4 = managers[0]?.top4 !== undefined;

    // Sort state
    window._histSort = window._histSort || { col: 'earned', dir: -1 };

    const sortedManagers = [...managers].sort((a, b) => {
      const { col, dir } = window._histSort;
      const av = a[col] ?? 0, bv = b[col] ?? 0;
      if (typeof av === 'string') return dir * av.localeCompare(bv);
      return dir * (av - bv);
    });

    const arrow = col => {
      if (window._histSort.col !== col) return '';
      return window._histSort.dir === -1 ? ' sort-desc' : ' sort-asc';

    const th = (col, label, width) =>

        '</div>';
    }
    if (cup.winner) {
      html += '<div style="background:rgba(255,215,0,0.08);border:1px solid rgba(255,215,0,0.2);border-radius:8px;padding:10px 14px;">' +
        '<div style="font-size:10px;color:#FFD700;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;">🏆 Cup Champion</div>' +
        '<div style="font-weight:700;color:var(--theme);margin-bottom:4px;">' + esc(cup.winner) + '</div>' +
        (toArr(cup.runner_up).length ? '<div style="font-size:11px;color:var(--text3);">🥈 ' + toArr(cup.runner_up).join(', ') + '</div>' : '') +
        (toArr(cup.third).length ? '<div style="font-size:11px;color:var(--text3);">🥉 ' + toArr(cup.third).join(', ') + '</div>' : '') +

    html += '<div class="table-scroll-wrap scroll-at-start"><div class="table-outer"><div class="table-wrap"><table id="historical-table" style="width:100%;border-collapse:separate;border-spacing:0;font-size:13px;">';
    html += '<thead><tr style="border-bottom:1px solid var(--border);">';
    html += '<th style="width:40px;padding:8px 6px;text-align:center;color:var(--theme);font-weight:600;font-family:var(--font-mono);font-size:11px;z-index:2;">#</th>';
    html += '<th style="padding:8px 10px;text-align:left;color:var(--theme);font-weight:600;font-family:var(--font-mono);font-size:11px;">Manager</th>';
    html += th('earned', '💰 Earned', '70px');
    if (has4) {
      html += th('top1', '🥇 1st', '55px');
      html += th('top2', '🥈 2nd', '55px');
      html += th('top3', '🥉 3rd', '55px');
      html += th('top4', '4th', '55px');
    } else {
      html += th('top1', '🥇 1st', '55px');
      html += th('top2', '🥈 2nd', '55px');
    }
    if (has4) html += th('second_last', '2nd Last', '60px');
    html += th('last', '💀 Last', '55px');
    html += th('guinness', '🍺 Owed', '60px');
    html += '</tr></thead><tbody>';

    // Build lookup maps for league top5 and cup podium
    // Handle both old (string) and new (array) formats
    const leaguePositions = {};
    [toArr(league.winner), toArr(league.runner_up), toArr(league.third), toArr(league.fourth), toArr(league.fifth)].forEach((names, pos) => {
      names.forEach(n => { if (n) leaguePositions[n] = pos; });
    });
    const cupPositions = {};
    [toArr(cup.winner), toArr(cup.runner_up), toArr(cup.third)].forEach((names, pos) => {
      names.forEach(n => { if (n) cupPositions[n] = pos; });
    });

    const leagueEmoji = ['🥇','🥈','🥉','4️⃣','5️⃣'];

    sortedManagers.forEach((m, i) => {
      const lPos = leaguePositions[m.name];
      const cPos = cupPositions[m.name];
      const lBadge = lPos !== undefined ? ' ' + leagueEmoji[lPos] : '';
      const bg = i % 2 === 0 ? '' : 'background:var(--bg2);';
      html += '<tr style="' + bg + 'border-bottom:1px solid var(--border);">';
      html += '<td style="padding:8px 6px;text-align:center;font-family:var(--font-mono);font-weight:700;color:var(--theme);">' + (i+1) + '</td>';
      html += '<td style="padding:8px 10px;"><div style="font-weight:600;color:var(--text);">' + esc(m.name) + lBadge + '</div></td>';
      html += '<td style="padding:8px 6px;text-align:center;font-family:var(--font-mono);font-weight:600;color:' + (m.earned > 0 ? 'var(--green)' : 'var(--text3)') + ';">$' + m.earned.toFixed(0) + '</td>';
      if (has4) {
        html += '<td style="padding:8px 6px;text-align:center;font-family:var(--font-mono);color:var(--text2);">' + (m.top1 || '—') + '</td>';
        html += '<td style="padding:8px 6px;text-align:center;font-family:var(--font-mono);color:var(--text2);">' + (m.top2 || '—') + '</td>';
        html += '<td style="padding:8px 6px;text-align:center;font-family:var(--font-mono);color:var(--text2);">' + (m.top3 || '—') + '</td>';
        html += '<td style="padding:8px 6px;text-align:center;font-family:var(--font-mono);color:var(--text2);">' + (m.top4 || '—') + '</td>';
        html += '<td style="padding:8px 6px;text-align:center;font-family:var(--font-mono);color:' + (m.second_last > 0 ? 'var(--amber)' : 'var(--text3)') + ';">' + (m.second_last || '—') + '</td>';
      } else {
        html += '<td style="padding:8px 6px;text-align:center;font-family:var(--font-mono);color:var(--text2);">' + (m.top1 || '—') + '</td>';
        html += '<td style="padding:8px 6px;text-align:center;font-family:var(--font-mono);color:var(--text2);">' + (m.top2 || '—') + '</td>';
      }
      html += '<td style="padding:8px 6px;text-align:center;font-family:var(--font-mono);color:' + (m.last > 0 ? 'var(--red)' : 'var(--text3)') + ';">' + (m.last || '—') + '</td>';
      html += '<td style="padding:8px 6px;text-align:center;font-family:var(--font-mono);color:' + (m.guinness > 0 ? 'var(--amber)' : 'var(--text3)') + ';">' + (m.guinness || '—') + '</td>';
      html += '</tr>';
    });

    html += '</tbody></table></div></div></div>';
    html += '</div>';
    return html;
  }

  // Historical sort handler — re-renders with new sort
  window._histSortBy = function(col) {
    if (window._histSort.col === col) {
      window._histSort.dir *= -1;
    } else {
      window._histSort.col = col;
      window._histSort.dir = col === 'name' ? 1 : -1;
    }
    if (window._histData) {
      const tableOuter = document.querySelector('#historical-table')?.closest('.table-outer');
      const savedScrollX = tableOuter?.scrollLeft || 0;
      const savedScrollY = window.scrollY;

      document.getElementById('historical-content').innerHTML = renderHistoricalSeason(window._histData);

      requestAnimationFrame(() => {
        window.scrollTo(0, savedScrollY);
        const newOuter = document.querySelector('#historical-table')?.closest('.table-outer');
        if (newOuter) newOuter.scrollLeft = savedScrollX;
        initFloatingHeader('historical-table');
      });
    }
  };

  document.addEventListener('click', (e) => {
    const menu = document.getElementById('season-menu');
    const btn = document.getElementById('season-btn');
    if (menu && btn && !btn.contains(e.target) && !menu.contains(e.target)) {
      menu.style.display = 'none';
    }
    // Also close weekly dropdown
    const wMenu = document.getElementById('weekly-tab-menu');
    const wBtn = document.getElementById('weekly-tab-btn');
    if (wMenu && wBtn && !wBtn.contains(e.target) && !wMenu.contains(e.target)) {
      wMenu.style.display = 'none';
    }
  });
</script>
</body>
</html>
